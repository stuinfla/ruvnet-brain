<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" width="880" height="306" role="img" aria-labelledby="title desc">
<title id="title">A source-grounded workflow</title><desc id="desc">Ask about a need, discover a relevant capability, read its source and limitations, act through authorized tools, and verify the actual result. Eligible project evidence informs the next task.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#537c8c"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:15px;font-weight:700;letter-spacing:2px;fill:#81cdd0}.label{font-size:19px;font-weight:700;fill:#f0f6fa}.sub{font-size:14px;fill:#aec3d0}.small{font-size:12px;fill:#9bb2c3}.line{fill:none;stroke:#537c8c;stroke-width:2;marker-end:url(#arrow)}.box{fill:#152c40;stroke:#385268;stroke-width:1}.accent{fill:#183b42;stroke:#53b7b6;stroke-width:1}</style></defs>
<rect width="880" height="306" rx="18" fill="#0c1c2b"/><text class="heading" x="36" y="38">A QUESTION BECOMES REVIEWABLE WORK</text><text class="heading" x="108" y="78" text-anchor="middle">01</text><rect class="box" x="36" y="94" width="144" height="82" rx="10"/><text class="label" x="108.0" y="126" text-anchor="middle">ASK</text><text class="sub" x="108.0" y="150" text-anchor="middle">Describe the need</text><path class="line" d="M180 135 H202"/><text class="heading" x="274" y="78" text-anchor="middle">02</text><rect class="box" x="202" y="94" width="144" height="82" rx="10"/><text class="label" x="274.0" y="126" text-anchor="middle">DISCOVER</text><text class="sub" x="274.0" y="150" text-anchor="middle">Find a capability</text><path class="line" d="M346 135 H368"/><text class="heading" x="440" y="78" text-anchor="middle">03</text><rect class="accent" x="368" y="94" width="144" height="82" rx="10"/><text class="label" x="440.0" y="126" text-anchor="middle">READ</text><text class="sub" x="440.0" y="150" text-anchor="middle">Source + limits</text><path class="line" d="M512 135 H534"/><text class="heading" x="606" y="78" text-anchor="middle">04</text><rect class="box" x="534" y="94" width="144" height="82" rx="10"/><text class="label" x="606.0" y="126" text-anchor="middle">ACT</text><text class="sub" x="606.0" y="150" text-anchor="middle">Authorized tools</text><path class="line" d="M678 135 H700"/><text class="heading" x="772" y="78" text-anchor="middle">05</text><rect class="accent" x="700" y="94" width="144" height="82" rx="10"/><text class="label" x="772.0" y="126" text-anchor="middle">VERIFY</text><text class="sub" x="772.0" y="150" text-anchor="middle">Actual result</text><path class="line" d="M772 176 V222 H108 V176"/><rect x="280" y="200" width="330" height="44" rx="8" fill="#0c1c2b" stroke="#385268"/><text class="sub" x="445" y="227" text-anchor="middle">Project evidence informs the next task</text><text class="small" x="440" y="280" text-anchor="middle">Retain eligible memory; disclose unknowns and incomplete checks.</text></svg>