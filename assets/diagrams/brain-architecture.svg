<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" role="img" aria-labelledby="title desc">
<title id="title">RuvNet Brain architecture</title><desc id="desc">Public source is indexed into a signed local RVF bundle. Skills and lifecycle guidance connect a task in Claude Code or Codex to MCP source retrieval. Authorized host tools act, checks verify the result, and eligible project evidence is retained in AgentDB.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#537c8c"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:15px;font-weight:700;letter-spacing:2px;fill:#81cdd0}.label{font-size:19px;font-weight:700;fill:#f0f6fa}.sub{font-size:14px;fill:#aec3d0}.small{font-size:12px;fill:#9bb2c3}.line{fill:none;stroke:#537c8c;stroke-width:2;marker-end:url(#arrow)}.box{fill:#152c40;stroke:#385268;stroke-width:1}.accent{fill:#183b42;stroke:#53b7b6;stroke-width:1}</style></defs>
<rect width="880" height="780" rx="18" fill="#0c1c2b"/><text class="heading" x="40" y="40">PUBLIC KNOWLEDGE</text><text class="heading" x="442" y="40">YOUR LOCAL WORKFLOW</text><rect class="box" x="40" y="68" width="320" height="80" rx="10"/><text class="label" x="200.0" y="100" text-anchor="middle">RuvNet source + docs</text><text class="sub" x="200.0" y="124" text-anchor="middle">Public repositories and source files</text><rect class="box" x="40" y="204" width="320" height="80" rx="10"/><text class="label" x="200.0" y="236" text-anchor="middle">Build the knowledge</text><text class="sub" x="200.0" y="260" text-anchor="middle">Index passages, symbols and capabilities</text><rect class="accent" x="40" y="340" width="320" height="92" rx="10"/><text class="label" x="200.0" y="372" text-anchor="middle">Signed local bundle</text><text class="sub" x="200.0" y="396" text-anchor="middle">RVF stores + source-passage sidecars</text><path class="line" d="M200 148 V204"/><path class="line" d="M200 284 V340"/><rect class="box" x="442" y="68" width="398" height="80" rx="10"/><text class="label" x="641.0" y="100" text-anchor="middle">Your task</text><text class="sub" x="641.0" y="124" text-anchor="middle">Claude Code or Codex</text><rect class="box" x="442" y="204" width="398" height="80" rx="10"/><text class="label" x="641.0" y="236" text-anchor="middle">Skills + lifecycle guidance</text><text class="sub" x="641.0" y="260" text-anchor="middle">Discover relevant capabilities; read source</text><rect class="accent" x="442" y="340" width="398" height="92" rx="10"/><text class="label" x="641.0" y="372" text-anchor="middle">search_ruvnet · MCP</text><text class="sub" x="641.0" y="396" text-anchor="middle">Route → retrieve → rerank → source evidence</text><rect class="box" x="442" y="492" width="398" height="80" rx="10"/><text class="label" x="641.0" y="524" text-anchor="middle">Host tools / authorized executors</text><text class="sub" x="641.0" y="548" text-anchor="middle">Make changes within the requested scope</text><rect class="accent" x="442" y="628" width="398" height="80" rx="10"/><text class="label" x="641.0" y="660" text-anchor="middle">Checks, receipts + project evidence</text><text class="sub" x="641.0" y="684" text-anchor="middle">Eligible memory uses canonical AgentDB</text><path class="line" d="M641 148 V204"/><path class="line" d="M641 284 V340"/><path class="line" d="M360 386 H442"/><path class="line" d="M641 432 V492"/><path class="line" d="M641 572 V628"/><text class="small" x="40" y="506">SOURCE BOUNDARIES</text><text class="sub" x="40" y="536">A knowledge snapshot can trail upstream.</text><text class="sub" x="40" y="562">A recommendation is not execution.</text><text class="sub" x="40" y="588">A configured hook is not delivery proof.</text><text class="small" x="40" y="745">Evidence stays tied to what was read, what ran and what was actually checked.</text></svg>