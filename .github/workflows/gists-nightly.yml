name: gists-nightly
# Keep docs/RUV-GISTS.md in step with what rUv publishes.
#
# WHY ONLY THE INDEX. The KB stores (kb/*.passages.jsonl, *.rvf) are gitignored on purpose — they
# ship in the 512MB Release, not in git. So CI cannot commit vectors. What it CAN keep fresh, for
# free and with no LLM, is the index: the list of every gist, newest first, with its description.
# That is the durable "what is rUv thinking about right now" feed. Re-embedding stays a local /
# release-time step (`npm run gists:sync`).
#
# COST: ~5 authenticated API calls (the list endpoint, paginated). No per-gist fetch. No model.
# Runs 21:47 America/New_York = 01:47 UTC. Off-the-hour on purpose: every scheduled workflow on
# GitHub piles onto :00, and the runner queue shows it.

on:
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    # A hung API call must not hold a runner for GitHub's 6-hour default (4.7.21; runs take about 30 s).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh the gist index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ingest-gists.mjs --index-only

      - name: Report new gists (index commit is handled in-session / by the local nightly)
        run: |
          if git diff --quiet -- docs/RUV-GISTS.md; then
            echo "no new or updated gists since the last commit"
            exit 0
          fi
          echo "── new / changed gist rows ──"
          git diff --unified=0 -- docs/RUV-GISTS.md | grep '^+|' | head -30 || true
          echo ""
          echo "This workflow DETECTS + reports only, and stays green. Committing docs/RUV-GISTS.md to"
          echo "protected main from a bot needs a scoped PAT — a GITHUB_TOKEN-created PR cannot trigger"
          echo "the required 'check', so auto-merge blocks (verified 2026-07-15). Until a PAT is wired,"
          echo "the index is committed in-session and by the local nightly refresh."
