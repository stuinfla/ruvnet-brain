name: integration-linux
# Release PRs consume producer evidence; ordinary main changes execute reviewed acceptance.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate SHA when called by the release transaction
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ruvnet-brain-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    # A blocked child process must fail the workflow instead of consuming GitHub's six-hour default.
    # The full suite normally completes in under two minutes; fifteen minutes leaves room for cold
    # dependency/model setup while keeping a runner wedge observable.
    timeout-minutes: 125
    env:
      RUVNET_REQUIRE_CODEX_DISCOVERY: '1'
      QUALIFICATION_CONSUMER: ${{ !inputs.candidate_sha && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        if: env.QUALIFICATION_CONSUMER != 'true'
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Install kb deps (@ruvector/rvf lives here, not the root)
        if: env.QUALIFICATION_CONSUMER != 'true'
        run: cd kb && npm ci --no-audit --no-fund

      - name: Install and verify the required native Codex CLI
        if: env.QUALIFICATION_CONSUMER != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "$HOME/.npm-global" @openai/codex@latest
          "$HOME/.npm-global/bin/codex" --version
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Environment facts (so a failure is diagnosable from the log alone)
        if: env.QUALIFICATION_CONSUMER != 'true'
        run: |
          echo "shell:  $(readlink -f /bin/sh)"
          echo "bash:   $(bash --version | head -1)"
          echo "grep:   $(grep --version | head -1)"
          echo "sed:    $(sed --version | head -1)"
          echo "jq:     $(jq --version 2>/dev/null || echo MISSING)"
          echo "gh:     $(gh --version 2>/dev/null | head -1 || echo MISSING)"
          node --input-type=module -e 'import fs from "node:fs"; console.log("rvf stores present:", fs.readdirSync("kb").filter(name => name.endsWith(".rvf") && fs.statSync("kb/" + name).isFile()).length)'

      - name: Reviewed release integration acceptance
        if: env.QUALIFICATION_CONSUMER != 'true'
        run: node scripts/release-qualification.mjs --suite integration --platform linux --report /tmp/integration.json
      - name: Bind integration evidence to the exact source
        if: env.QUALIFICATION_CONSUMER != 'true' && inputs.candidate_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          node scripts/integration-evidence.mjs --qualified \
            --report /tmp/integration.json \
            --out integration-evidence.json \
            --sha "${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "${{ github.run_attempt }}"
      - name: Persist typed integration evidence
        if: env.QUALIFICATION_CONSUMER != 'true' && inputs.candidate_sha != ''
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          path: integration-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify already-qualified release source
        if: env.QUALIFICATION_CONSUMER == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/qualified-candidate-check.mjs --sha "$CANDIDATE_SHA" --required-check integration --timeout-ms 7200000 --poll-ms 30000
