name: router-native-diagnostic
on:
  push:
    branches: [diagnose/router-native-linux]
permissions:
  contents: read
jobs:
  native-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Install native sandbox CLI without authentication
        run: |
          set -euo pipefail
          npm config get omit
          npm install --global --prefix "$HOME/.npm-global" @openai/codex@latest --include=optional --fetch-retries=1 --no-audit --no-fund
          # JavaScript template literals must remain literal shell input.
          # shellcheck disable=SC2016
          CODEX_PREFIX="$HOME/.npm-global" node --input-type=module -e '
            import fs from "node:fs"; import path from "node:path"; import { createRequire } from "node:module";
            const root=path.join(process.env.CODEX_PREFIX,"lib/node_modules/@openai/codex/package.json");
            const wrapper=JSON.parse(fs.readFileSync(root,"utf8")), alias=wrapper.optionalDependencies["@openai/codex-linux-x64"];
            const platformFile=createRequire(root).resolve("@openai/codex-linux-x64/package.json"), platform=JSON.parse(fs.readFileSync(platformFile,"utf8"));
            if(alias!==`npm:@openai/codex@${platform.version}`) throw Error("installed platform differs from current wrapper metadata");
            const native=path.join(path.dirname(platformFile),"vendor/x86_64-unknown-linux-musl/codex/codex");
            fs.accessSync(native,fs.constants.X_OK); console.log(JSON.stringify({wrapperVersion:wrapper.version,alias,platformVersion:platform.version,native:fs.realpathSync(native)}));'
          "$HOME/.npm-global/bin/codex" --version
          command -v bwrap || true
          if command -v bwrap >/dev/null; then bwrap --version; fi
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      - name: Qualify Bubblewrap namespaces on the disposable hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          key=kernel.apparmor_restrict_unprivileged_userns
          sysctl "$key"
          value=$(sysctl -n "$key")
          test "$value" = 0 || test "$value" = 1
          printf '%s\n' "$value" > "$RUNNER_TEMP/router-native-userns-original"
          sudo sysctl -w "$key=0"
          test "$(sysctl -n "$key")" = 0
      - name: Run only the bounded native sandbox diagnostics
        run: node node_modules/vitest/vitest.mjs run tests/integration/model-managed-checker-native.test.mjs --maxWorkers=1 --silent=false
      - name: Restore the hosted runner namespace setting
        if: always() && runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          original="$RUNNER_TEMP/router-native-userns-original"
          if test -f "$original"; then
            value=$(cat "$original")
            test "$value" = 0 || test "$value" = 1
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$value"
            restored=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
            test "$restored" = "$value"
            printf 'Verified restored namespace setting: %s\n' "$restored"
          fi
