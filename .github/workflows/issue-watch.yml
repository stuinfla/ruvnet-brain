name: issue-watch

# WHY (2026-07-18, Stuart): "track what's going on with the issues — check no less than six times a
# day, every four hours." This runs in GitHub's CLOUD, not on Stuart's Mac, so it fires whether his
# laptop is open, asleep, or off. And GitHub records EVERY run in the Actions tab (timestamp +
# conclusion + logs) — an un-fakeable ledger he can look at. That is the proof. A local launchd job
# can report "exit 0" for a run that never happened (house lesson 2026-07-13); a cloud run cannot
# pretend — either the Actions tab shows the run or it does not.
#
# What it does each run: lists every OPEN issue on stuinfla/ruvnet-brain, checks whether the owner
# (@stuinfla) has responded within the 4h SLA, writes the full result to the run's Step Summary, and
# — on a breach — pushes an ntfy alert (if NTFY_TOPIC secret is set) AND marks the run with a warning
# so GitHub's own notifications reach Stuart even with no secret configured.
#
# Scope: this is the DETECT + ALERT path (read-only, free, GITHUB_TOKEN only). The heavier auto-FIX
# path (scripts/issue-fix.mjs, which spawns a headless Claude and costs money + needs credentials) is
# deliberately NOT on this schedule — fixing is a conscious, cost-bearing action, not an unattended one.

on:
  workflow_dispatch: {}      # manual trigger remains available; four-hour schedule paused 2026-09-18

permissions:
  issues: read               # gh issue list / view — read only; this job never writes to GitHub
  contents: read

concurrency:
  group: issue-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check open issues + 4h SLA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # gh CLI auth (pre-installed on the runner)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}       # optional: phone push on breach; absent -> still logs + warns
          ISSUE_WATCH_STATE: ${{ runner.temp }}/issue-watch-state.json
        run: |
          set -o pipefail
          node scripts/issue-watch.mjs 2>&1 | tee "$RUNNER_TEMP/watch.out"
          {
            echo "### 🔔 Issue SLA watch — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/watch.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface any SLA breach (so GitHub notifies even without ntfy)
        if: always()
        run: |
          if grep -qiE 'breach: yes|SLA BREACH|BREACHED' "$RUNNER_TEMP/watch.out"; then
            echo "::warning title=Issue SLA breach::One or more open issues have breached the 4h owner-response SLA. See the Step Summary."
            echo "An open issue is past the 4h SLA — check the run summary and respond." >&2
            exit 1
          fi
          echo "All open issues within SLA."
