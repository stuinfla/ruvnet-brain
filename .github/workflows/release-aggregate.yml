name: release-aggregate

on:
  workflow_run:
    workflows: [stranger-matrix]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      stranger_run_id:
        description: Successful stranger-matrix run bound to the candidate payload
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  release-aggregate:
    name: release-aggregate
    # Failed stranger runs have no binding receipt; only successful workflow_run events and
    # explicit recovery dispatches are valid aggregate inputs.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the exact stranger run
        id: trigger
        env:
          INPUT_SHA: ${{ inputs.candidate_sha }}
          INPUT_RUN: ${{ inputs.stranger_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${{ github.event.workflow_run.head_sha }}}"
          run_id="${INPUT_RUN:-${{ github.event.workflow_run.id }}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test -n "$run_id"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "stranger_run=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the stranger-to-candidate binding receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.trigger.outputs.stranger_run }}
          name: stranger-evidence-${{ steps.trigger.outputs.sha }}
          path: binding

      - name: Validate binding identity
        id: binding
        env:
          EXPECTED_SHA: ${{ steps.trigger.outputs.sha }}
          EXPECTED_STRANGER_RUN: ${{ steps.trigger.outputs.stranger_run }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('binding/stranger-evidence.json', 'utf8'));
          if (value.verdict !== 'PASS' || value.sha !== process.env.EXPECTED_SHA
            || String(value.strangerRunId) !== process.env.EXPECTED_STRANGER_RUN
            || !/^\d+$/.test(String(value.sourceCiRunId)) || !/^[a-f0-9]{64}$/.test(value.payloadId)) {
            throw new Error('stranger evidence binding is invalid');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `sha=${value.sha}\npayload_id=${value.payloadId}\nci_run=${value.sourceCiRunId}\n`);
          NODE

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.binding.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download the exact build-once payload and host receipts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.binding.outputs.ci_run }}
          name: release-evidence-${{ steps.binding.outputs.sha }}
          path: release-evidence

      - name: Reverify payload and candidate host evidence identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.binding.outputs.sha }}
          EXPECTED_PAYLOAD: ${{ steps.binding.outputs.payload_id }}
        run: |
          set -euo pipefail
          node scripts/release-payload.mjs verify-members --manifest release-evidence/payload-manifest.json > "$RUNNER_TEMP/payload.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/payload.json', 'utf8'));
          const hosts = JSON.parse(fs.readFileSync('release-evidence/candidate-host-evidence.json', 'utf8'));
          if (payload.payloadId !== process.env.EXPECTED_PAYLOAD || hosts.payloadId !== payload.payloadId
            || hosts.sha !== process.env.EXPECTED_SHA || hosts.leaves?.length !== 3) {
            throw new Error('candidate host evidence identity mismatch');
          }
          NODE

      - name: Boundedly observe exact-SHA workflow and job evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.binding.outputs.sha }}
          CI_RUN_ID: ${{ steps.binding.outputs.ci_run }}
          STRANGER_RUN_ID: ${{ steps.trigger.outputs.stranger_run }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.CANDIDATE_SHA;
          const view = (id) => JSON.parse(execFileSync('gh', ['run', 'view', String(id), '--repo', repo,
            '--json', 'databaseId,workflowName,headSha,status,conclusion,jobs'], { encoding: 'utf8' }));
          const successful = (workflow) => {
            const rows = JSON.parse(execFileSync('gh', ['run', 'list', '--repo', repo, '--workflow', workflow,
              '--commit', sha, '--json', 'databaseId,status,conclusion,headSha'], { encoding: 'utf8' }));
            const row = rows.find((item) => item.headSha === sha && item.status === 'completed' && item.conclusion === 'success');
            return row ? view(row.databaseId) : null;
          };
          const evidence = {
            ci: view(process.env.CI_RUN_ID),
            stranger: view(process.env.STRANGER_RUN_ID),
            integration: successful('integration-linux.yml'),
            ux: successful('ux-qe.yml'),
          };
          if (Object.values(evidence).some((run) => !run || run.headSha !== sha
            || run.status !== 'completed' || run.conclusion !== 'success')) process.exit(1);
          fs.writeFileSync(process.env.RUNNER_TEMP + '/workflow-evidence.json', JSON.stringify(evidence));
          NODE
            then break; fi
            test "$attempt" -lt 20 || { echo 'exact-SHA evidence remained incomplete after bounded polling' >&2; exit 1; }
            sleep $((attempt < 6 ? attempt * 3 : 18))
          done

      - name: Derive every leaf from a real run, job, or machine receipt
        env:
          CANDIDATE_SHA: ${{ steps.binding.outputs.sha }}
          PAYLOAD_ID: ${{ steps.binding.outputs.payload_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/workflow-evidence.json', 'utf8'));
          const hosts = JSON.parse(fs.readFileSync('release-evidence/candidate-host-evidence.json', 'utf8'));
          const findJob = (run, name) => {
            const job = run.jobs.find((value) => value.name === name);
            if (!job || job.status !== 'completed' || job.conclusion !== 'success') throw new Error(`required job failed or missing: ${run.workflowName}/${name}`);
            return job;
          };
          const leaf = (name, run, jobs) => ({
            name,
            sha: process.env.CANDIDATE_SHA,
            payloadId: process.env.PAYLOAD_ID,
            status: 'completed',
            conclusion: 'success',
            verdict: 'PASS',
            workflow: run.workflowName,
            runId: run.databaseId,
            jobIds: jobs.map((job) => job.databaseId),
          });
          const ciCheck = findJob(runs.ci, 'check');
          const releaseQe = findJob(runs.ci, 'release-qe');
          const integration = findJob(runs.integration, 'integration');
          const ubuntu = findJob(runs.stranger, 'ubuntu');
          const macos = findJob(runs.stranger, 'macos');
          const winBash = findJob(runs.stranger, 'windows-gitbash');
          const winPowershell = findJob(runs.stranger, 'windows-powershell');
          for (const run of [runs.ux]) for (const job of run.jobs) {
            if (job.status !== 'completed' || job.conclusion !== 'success') throw new Error(`UX leaf is not PASS: ${job.name}`);
          }
          const leaves = [
            leaf('source-quality', runs.ci, [ciCheck]),
            leaf('ux-qe', runs.ux, runs.ux.jobs),
            leaf('release-qe', runs.ci, [releaseQe]),
            leaf('integration-linux', runs.integration, [integration]),
            leaf('stranger-linux', runs.stranger, [ubuntu]),
            leaf('stranger-macos', runs.stranger, [macos]),
            leaf('stranger-windows', runs.stranger, [winBash, winPowershell]),
            ...hosts.leaves,
          ];
          fs.writeFileSync('release-evidence/release-leaves.json', JSON.stringify(leaves, null, 2));
          NODE
          node scripts/release-evidence-aggregate.mjs \
            --sha "$CANDIDATE_SHA" \
            --payload-id "$PAYLOAD_ID" \
            --leaves release-evidence/release-leaves.json \
            --out release-evidence/aggregate-envelope.json

      - name: Persist aggregate evidence for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-aggregate-${{ steps.binding.outputs.sha }}
          path: |
            release-evidence/aggregate-envelope.json
            release-evidence/release-leaves.json
          if-no-files-found: error
          retention-days: 90
