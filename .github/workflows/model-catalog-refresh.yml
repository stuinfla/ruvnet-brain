name: model-catalog-refresh

# ADR-016 / issue #238: the 14-day truth wall needs an owner that can land fresh facts.
# A weekly cadence leaves a full week to recover from a failed run before the wall expires.
on:
  schedule:
    - cron: '13 9 * * 1'
  workflow_dispatch:

# REPORT-ONLY (4.7.21, decision D4). The job used to push a branch and open a pull request, which this repo's
# Actions token is not allowed to do, so it failed every Monday after doing its real work. It now leaves the
# refreshed catalog, its diff and the source evidence as an artifact plus a job summary; landing a change is a
# deliberate in-session commit. No write permission and no repo setting is needed.
permissions:
  contents: read

concurrency:
  group: model-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Exit 1 only when the router's core evidence (inventory, evaluations) failed; a broken third-party advisory
      # page alone is `partial`: exit 0 with a ::warning annotation and a line in the job summary.
      - name: Collect weekly independent model and effort evidence
        run: |
          set -o pipefail
          node scripts/model-currency.mjs --refresh --router-dir "$RUNNER_TEMP/model-currency" | tee "$RUNNER_TEMP/model-currency.out"

      - name: Summarize the model-currency verdict
        if: always()
        run: node scripts/model-currency.mjs --summarize "$RUNNER_TEMP/model-currency.out" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve source evidence and incomplete-refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-currency-evidence
          path: ${{ runner.temp }}/model-currency/
          retention-days: 30
          if-no-files-found: error

      - name: Refresh and verify the same live facts
        run: |
          set -euo pipefail
          npm run catalog:refresh
          npm run catalog:verify

      - name: Preserve the refreshed catalog and its diff for review
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/catalog-refresh"
          mkdir -p "$out"
          git diff -- data/model-catalog.json data/openrouter-catalog-snapshot.json > "$out/catalog.diff"
          cp data/model-catalog.json data/openrouter-catalog-snapshot.json "$out/"
          {
            echo "### Model catalog refresh"
            if [ -s "$out/catalog.diff" ]; then
              echo "OpenRouter facts changed ($(grep -c '^[-+][^-+]' "$out/catalog.diff") changed lines). Review the \`model-catalog-refresh\` artifact and land it in-session."
            else
              echo "OpenRouter facts are unchanged; nothing to land."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the refreshed catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-catalog-refresh
          path: ${{ runner.temp }}/catalog-refresh/
          retention-days: 30
          if-no-files-found: warn
