name: ux-qe

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string

concurrency:
  group: ruvnet-brain-ux-qe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ux-qe:
    name: ux-qe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Run deterministic UX hard gates
        env:
          UX_QE_EVIDENCE: artifacts/ux-qe-${{ runner.os }}.json
        run: npm run qe:ux
      - name: Upload machine-readable UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-evidence-${{ inputs.candidate_sha || github.sha }}-${{ runner.os }}
          path: artifacts/ux-qe-${{ runner.os }}.json
          if-no-files-found: error
