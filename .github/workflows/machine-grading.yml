name: machine-grading

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      input_artifact_id:
        description: Exact-source artifact containing review inputs
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  produce:
    runs-on: [self-hosted, subscription]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact candidate review inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARTIFACT_ID: ${{ inputs.input_artifact_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_ARTIFACT_ID" =~ ^[0-9]+$ && "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID")"
          jq -e --arg sha "$CANDIDATE_SHA" '.expired == false and .workflow_run.head_sha == $sha and .name == ("release-review-inputs-" + $sha)' <<<"$metadata" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID/zip" > "$RUNNER_TEMP/review-inputs.zip"
          mkdir -p review-inputs
          mapfile -t entries < <(unzip -Z1 "$RUNNER_TEMP/review-inputs.zip")
          ((${#entries[@]} == 2))
          for entry in "${entries[@]}"; do
            [[ "$entry" == fable-input.json || "$entry" == astra-input.json ]] || exit 1
            unzip -p "$RUNNER_TEMP/review-inputs.zip" "$entry" > "review-inputs/$entry"
            test -f "review-inputs/$entry" && test ! -L "review-inputs/$entry"
          done
      - name: Produce signed native pair
        env:
          RUVNET_FABLE_REVIEW_SIGNING_KEY: ${{ secrets.RUVNET_FABLE_REVIEW_SIGNING_KEY }}
          RUVNET_ASTRA_REVIEW_SIGNING_KEY: ${{ secrets.RUVNET_ASTRA_REVIEW_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/native-machine-grading-producer.mjs --input review-inputs/fable-input.json --out claude-fable-5-1.json --reviewer claude-fable-5-1
          node scripts/native-machine-grading-producer.mjs --input review-inputs/astra-input.json --out gpt-6-astra.json --reviewer gpt-6-astra
      - uses: actions/upload-artifact@v4
        with:
          name: machine-grading-${{ inputs.candidate_sha }}
          path: |
            claude-fable-5-1.json
            gpt-6-astra.json
          if-no-files-found: error
          retention-days: 14
