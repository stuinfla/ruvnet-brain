# DIAGNOSTIC ONLY — manual, bounded proof for issue #145.
name: diag-145-hang

on:
  workflow_dispatch:

jobs:
  root-cause-proof:
    name: procfs root cause and repaired test (Ubuntu, Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-audit --no-fund --loglevel=error

      - name: Prove the module is inspectable text with the same escaped separator
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const bytes = fs.readFileSync('plugin/scripts/decision-outcomes.mjs');
          if (bytes.includes(0)) throw new Error('raw NUL byte remains in JavaScript source');
          const escaped = bytes.toString('utf8').match(/\\u0000/g) || [];
          if (escaped.length !== 2) throw new Error(`expected two escaped separators, found ${escaped.length}`);
          NODE

      - name: Reproduce the retired procfs fixture without hanging the job
        shell: bash
        run: |
          set +e
          timeout 10s node -e "require('node:fs').mkdirSync('/proc/nope', { recursive: true })"
          status=$?
          set -e
          test "$status" -eq 124 || {
            echo "expected Node 20 recursive mkdir on procfs to time out; exit=$status" >&2
            exit 1
          }

      - name: Prove the deterministic replacement exits and passes
        run: timeout 60s npx vitest run tests/unit/decision-outcomes.test.mjs
