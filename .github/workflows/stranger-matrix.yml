name: stranger-matrix
# ADR-058 §D8 "stranger's machine · 18 → 95 · FIRST, because it caps everything" — the deduction this
# closes: "verification failures do not stop installation" (-35) and "nothing on a user's machine
# exercises even one hook fire post-install" (-15). Installs FROM THE PACKED NPM TARBALL of the
# candidate SHA — never the checkout, which is the thing that always works and is why issues #42/#43
# shipped broken (a dependency present in the checkout but absent from `npm pack`'s file list).
#
# Five images, each asserting the SAME three things (scripts/ci/stranger-scenario.mjs is the one
# shared driver — reused across all five, not reimplemented per OS):
#   (a) healthy        -> exit 0 AND at least one hook FIRED through the INSTALLED registration
#                          (fires the REAL plugin/ tree at this SHA, via the REAL external
#                          process-group watchdog scripts/selfcheck.mjs already ships)
#   (b) seeded-broken   -> forge-mcp-all.mjs deleted from the fixture bundle -> exit NON-ZERO (M-D8a)
#   (c) no author-local ~/.claude/settings.json exists in any image — asserted inside the driver
#       before anything runs, so any README-promised behavior that only fires from the owner's own
#       settings layer would be caught here as a lie.
#
# The hostile cell ALSO runs a `strict-ungrounded` scenario proving RUVNET_STRICT_INSTALL=1 (the one
# place a normally non-fatal grounding-smoke failure becomes fatal) is real, and the ubuntu cell
# ADDITIONALLY proves M-D8c (a hook that sleeps past its declared timeout makes the battery go red)
# against the real installed surface.
#
# THE FINDING THIS GATE CAUGHT FIRST, AND ITS CLOSURE (kept as the record, not deleted — the point
# of the note was that a green first run "would be the self-congratulation it exists to kill", and
# that stays true of the run that WAS red):
#   RED, on all five images: plugin/scripts/session-start.sh wrote 8.7-13KB of stdout on a virgin
#   machine — 2-3x the 4096-byte STDOUT_CAP_BYTES scripts/selfcheck.mjs enforces — and left
#   descendants alive after SIGTERM to its process group. Pre-existing on origin's unmodified HEAD,
#   not introduced by this workflow, and recorded here for weeks as separate work.
#   CLOSED 2026-07-27 (branch feat/advocacy-dial-1-5). Measured through this exact driver, from a
#   packed tarball into a virgin HOME: 10652/9127 bytes -> 3663, four stdin regimes x both sources,
#   zero contract violations, `✓ Self-check passed`. THE PLAYBOOK's full text moved to
#   plugin/skills/ruvnet-brain/PLAYBOOK.md; the three background jobs moved out of the hook's
#   process group via plugin/scripts/detach.mjs, each with an explicit TTL and a written receipt.
#   Both guards proven by mutation (+5KB filler -> 8x stdout-flood; a bare `&` job that outlives the
#   parent -> 8x orphan, survivors=true). Details in ADR-055 build item 2's closure note.
#
# Not yet added to branch protection as a required check — ADR-058's build order (item 10) flips the
# release gate only "after 1-9 exist"; this is item 1. Making it required is a repo-admin action
# (branch protection settings), not something this file can do on its own. The blocker that note
# named — "wait until the stdout-budget finding has a real fix" — is now discharged; what remains
# is the admin action and the rest of items 2-9.
on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CANDIDATE_RUN_ID: ${{ github.run_id }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}

jobs:
  # ── THE GUARD: one condition, read by every cell below ──────────────────────────────────────────
  #
  # WHY. This workflow triggers on `workflow_run: [ci] types: [completed]`, and `completed` fires
  # REGARDLESS OF CONCLUSION and regardless of branch. So it also ran on:
  #   - ci runs that FAILED, where release-qe never uploaded the sealed candidate; and
  #   - pull_request ci runs, where ci uploads `release-evidence-${{ github.sha }}` under the MERGE
  #     commit while this workflow asks for `workflow_run.head_sha` — two different names.
  # In both cases every cell died instantly on
  #   "Unable to download artifact(s): Artifact not found for name: release-evidence-<sha>"
  # — all five OS jobs red together, which reads like a five-platform outage and is actually one
  # missing file.
  #
  # MEASURED 2026-08-05: stranger-matrix passed 9 of 20 runs on main (45%). release-aggregate.yml
  # requires ci AND stranger AND integration-linux AND ux-qe green on the SAME sha, so at
  # 0.70 x 0.45 x 0.70 x 0.95 a release attempt succeeded about ONE TIME IN FIVE. This gate was the
  # dominant term, and almost none of its failures were real findings.
  #
  # The condition lives ONCE here and the five cells read it through `needs:`. Repeating an `if:`
  # five times is how the two host harnesses drifted apart; one fact, one place.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Why this run is eligible
        run: |
          echo "trigger:    protected-release"
          echo "candidate:  $CANDIDATE_SHA"
          echo "ci run:     $CANDIDATE_RUN_ID"
  # ── shared prep, three POSIX-shaped jobs (ubuntu / macos share the exact same steps) ─────────────
  ubuntu:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the one CI-sealed candidate
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}
      - name: npm install FROM the tarball into a fresh project (never the checkout)
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj"
          echo '{}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/ruvnet-brain-*.tgz
      - name: (a)+(c) healthy image — exit 0, >=1 real hook fire, no author-local settings.json
        run: |
          node scripts/ci/stranger-scenario.mjs \
            --scenario healthy \
            --installed "$RUNNER_TEMP/proj/node_modules/ruvnet-brain" \
            --home "$RUNNER_TEMP/home-healthy" \
            --plugin-src "$RUNNER_TEMP/proj/node_modules/ruvnet-brain/plugin"
      - name: M-D8c — a hook that sleeps past its declared timeout makes the battery go RED
        if: always()
        run: |
          node scripts/ci/mutate-hook-timeout.mjs \
            --installed "$RUNNER_TEMP/proj/node_modules/ruvnet-brain" \
            --home "$RUNNER_TEMP/home-healthy"
      - name: (b) seeded-broken image (M-D8a) — forge-mcp-all.mjs deleted -> exit NON-ZERO
        if: always()
        run: |
          node scripts/ci/stranger-scenario.mjs \
            --scenario seeded-broken \
            --installed "$RUNNER_TEMP/proj/node_modules/ruvnet-brain" \
            --home "$RUNNER_TEMP/home-broken" \
            --plugin-src "$RUNNER_TEMP/proj/node_modules/ruvnet-brain/plugin"

  macos:
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the one CI-sealed candidate
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}
      - name: npm install FROM the tarball into a fresh project (never the checkout)
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj"
          echo '{}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/ruvnet-brain-*.tgz
      - name: (a)+(c) healthy image — exit 0, >=1 real hook fire, no author-local settings.json
        run: |
          node scripts/ci/stranger-scenario.mjs \
            --scenario healthy \
            --installed "$RUNNER_TEMP/proj/node_modules/ruvnet-brain" \
            --home "$RUNNER_TEMP/home-healthy" \
            --plugin-src "$RUNNER_TEMP/proj/node_modules/ruvnet-brain/plugin"
      - name: (b) seeded-broken image (M-D8a) — forge-mcp-all.mjs deleted -> exit NON-ZERO
        if: always()
        run: |
          node scripts/ci/stranger-scenario.mjs \
            --scenario seeded-broken \
            --installed "$RUNNER_TEMP/proj/node_modules/ruvnet-brain" \
            --home "$RUNNER_TEMP/home-broken" \
            --plugin-src "$RUNNER_TEMP/proj/node_modules/ruvnet-brain/plugin"

  # ── windows, Git-Bash shell — this repo has already been bitten by /bin/bash not existing on
  # Windows runners and by cmd.exe mangling quoted arguments (scripts/selfcheck.mjs's own
  # shellInvocation() header). `shell: bash` here resolves to Git for Windows' bash (the same shell
  # Claude Code uses for hooks on a real Windows machine when the user has Git Bash configured),
  # never /bin/bash. Only the FIXTURE-BUILDING zip step is native PowerShell — that branch lives in
  # scripts/ci/stranger-scenario.mjs itself (keyed on process.platform, not on which shell launched
  # node), so it is identical regardless of which of these two Windows jobs is running. EXTRACTION is
  # no longer shelled out at all: this is the exact cell that caught `unzip -q -o D:\a\...` exiting 1
  # under Git Bash (MSYS2 unzip receiving native backslash paths through cmd.exe), and the product
  # now extracts in-process with node:zlib via kb/zip-extract.mjs.
  windows-gitbash:
    needs: gate
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the one CI-sealed candidate
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}
      - name: npm install FROM the tarball into a fresh project (never the checkout)
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj"
          echo '{}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/ruvnet-brain-*.tgz
      - name: (a)+(c) healthy image — exit 0, >=1 real hook fire, no author-local settings.json
        run: |
          node scripts/ci/stranger-scenario.mjs \
            --scenario healthy \
            --installed "$RUNNER_TEMP/proj/node_modules/ruvnet-brain" \
            --home "$RUNNER_TEMP/home-healthy" \
            --plugin-src "$RUNNER_TEMP/proj/node_modules/ruvnet-brain/plugin"
      - name: (b) seeded-broken image (M-D8a) — forge-mcp-all.mjs deleted -> exit NON-ZERO
        if: always()
        run: |
          node scripts/ci/stranger-scenario.mjs \
            --scenario seeded-broken \
            --installed "$RUNNER_TEMP/proj/node_modules/ruvnet-brain" \
            --home "$RUNNER_TEMP/home-broken" \
            --plugin-src "$RUNNER_TEMP/proj/node_modules/ruvnet-brain/plugin"

  # ── windows, PowerShell shell — the OTHER real Windows path (default terminal for most Windows
  # users who never installed Git Bash). Same driver script; only the wrapping shell differs.
  windows-powershell:
    needs: gate
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the one CI-sealed candidate
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}
      - name: npm install FROM the tarball into a fresh project (never the checkout)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/proj" | Out-Null
          Set-Location "$env:RUNNER_TEMP/proj"
          '{}' | Set-Content -Path package.json
          $tgz = Get-ChildItem "$env:RUNNER_TEMP" -Filter 'ruvnet-brain-*.tgz' | Select-Object -First 1
          npm install --no-audit --no-fund $tgz.FullName
      - name: (a)+(c) healthy image — exit 0, >=1 real hook fire, no author-local settings.json
        run: |
          node scripts/ci/stranger-scenario.mjs `
            --scenario healthy `
            --installed "$env:RUNNER_TEMP/proj/node_modules/ruvnet-brain" `
            --home "$env:RUNNER_TEMP/home-healthy" `
            --plugin-src "$env:RUNNER_TEMP/proj/node_modules/ruvnet-brain/plugin"
      - name: (b) seeded-broken image (M-D8a) — forge-mcp-all.mjs deleted -> exit NON-ZERO
        if: always()
        run: |
          node scripts/ci/stranger-scenario.mjs `
            --scenario seeded-broken `
            --installed "$env:RUNNER_TEMP/proj/node_modules/ruvnet-brain" `
            --home "$env:RUNNER_TEMP/home-broken" `
            --plugin-src "$env:RUNNER_TEMP/proj/node_modules/ruvnet-brain/plugin"

  # ── the hostile container: no jq, no gh, sh-only, HOME containing a space, network denied ────────
  # node:20-alpine is chosen deliberately: busybox's default shell is `sh` (no bash at all unless
  # explicitly installed, which this job never does), and the base image ships neither jq nor gh —
  # both left absent on purpose rather than removed, so "no jq, no gh" is a property of the image,
  # not a step that could silently stop being true. zip/unzip ARE installed (apk add), because their
  # absence would test an entirely different thing (bin/install.mjs's own "no zip extraction tool"
  # die() path) than what D8 is about here — the grounding-smoke DEGRADED state.
  #
  # NETWORK DENIED: a GitHub-hosted `container:` job cannot be given a literal --network=none (that
  # flag is not exposed through the Actions container config), so this is enforced at the level that
  # actually matters for THIS scenario: HTTPS_PROXY/HTTP_PROXY point at an address nothing listens
  # on, so any attempted outbound call (there should be none at all — --local mode makes zero network
  # calls, verified: the only two network functions in bin/install.mjs, resolveRelease's fetchJson and
  # download(), are both skipped in --local mode) fails FAST instead of silently succeeding or hanging.
  hostile:
    needs: gate
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    defaults:
      run:
        shell: sh
    # THE BLACKHOLED PROXY IS PER-STEP, NOT PER-JOB. It was job-level `env:`, which meant the dead
    # proxy also strangled the image's OWN SETUP — `apk add` could not reach the alpine repos
    # ("ERROR: unable to select packages"), and with apk dead the checkout never landed, so every
    # later step died on `Cannot find module .../scripts/ci/stranger-scenario.mjs`. Three red steps,
    # one cause, and none of them the thing this cell exists to test.
    #
    # The point of the blackhole is that the PRODUCT must behave on a box with no outbound network.
    # Fetching the product, and the tools needed to unpack it, is not part of that claim — a stranger
    # obtains the package by some means we do not control. So the hostility is applied exactly where
    # the assertion lives and nowhere else.
    steps:
      - name: apk add zip/unzip ONLY — explicitly no jq, no gh
        run: apk add --no-cache zip unzip
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      # No actions/setup-node here: the alpine image's own node/npm are what a musl-based hostile
      # box actually has; actions/setup-node downloads a glibc build that will not run on it.
      - name: Download the one CI-sealed candidate
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ env.CANDIDATE_SHA }}
          path: /tmp/ci-out
      - name: npm install FROM the tarball into a fresh project (never the checkout)
        run: |
          mkdir -p /tmp/ci-out/proj
          cd /tmp/ci-out/proj
          echo '{}' > package.json
          npm install --no-audit --no-fund /tmp/ci-out/ruvnet-brain-*.tgz
      - name: (a)+(c) healthy image — HOME contains a space, exit 0, >=1 real hook fire, no author settings.json
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        run: |
          mkdir -p "/tmp/virgin home"
          node scripts/ci/stranger-scenario.mjs \
            --scenario healthy \
            --installed /tmp/ci-out/proj/node_modules/ruvnet-brain \
            --home "/tmp/virgin home/healthy" \
            --plugin-src /tmp/ci-out/proj/node_modules/ruvnet-brain/plugin
      - name: (b) seeded-broken image (M-D8a) — forge-mcp-all.mjs deleted -> exit NON-ZERO
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        if: always()
        run: |
          node scripts/ci/stranger-scenario.mjs \
            --scenario seeded-broken \
            --installed /tmp/ci-out/proj/node_modules/ruvnet-brain \
            --home "/tmp/virgin home/broken" \
            --plugin-src /tmp/ci-out/proj/node_modules/ruvnet-brain/plugin
      - name: RUVNET_STRICT_INSTALL=1 — an unproven grounding smoke IS fatal here, though never by default
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
        if: always()
        run: |
          node scripts/ci/stranger-scenario.mjs \
            --scenario strict-ungrounded \
            --installed /tmp/ci-out/proj/node_modules/ruvnet-brain \
            --home "/tmp/virgin home/strict" \
            --plugin-src /tmp/ci-out/proj/node_modules/ruvnet-brain/plugin

  evidence-receipt:
    name: stranger-evidence-receipt
    needs: [ubuntu, macos, windows-gitbash, windows-powershell, hostile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the exact candidate exercised by every stranger cell
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ env.CANDIDATE_SHA }}
          path: release-evidence
      - name: Bind the stranger matrix to its source run and payload
        env:
          SOURCE_CI_RUN_ID: ${{ env.CANDIDATE_RUN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-payload.mjs verify-members --manifest release-evidence/payload-manifest.json > "$RUNNER_TEMP/payload.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/payload.json', 'utf8'));
          fs.writeFileSync('stranger-evidence.json', JSON.stringify({
            schemaVersion: 1,
            sha: process.env.CANDIDATE_SHA,
            payloadId: payload.payloadId,
            sourceCiRunId: process.env.SOURCE_CI_RUN_ID,
            strangerRunId: process.env.GITHUB_RUN_ID,
            verdict: 'PASS',
            jobs: ['ubuntu', 'macos', 'windows-gitbash', 'windows-powershell', 'hostile'],
          }, null, 2));
          NODE
      - name: Persist exact stranger evidence
        uses: actions/upload-artifact@v4
        with:
          name: stranger-evidence-${{ inputs.candidate_sha || github.sha }}
          path: stranger-evidence.json
          if-no-files-found: error
          retention-days: 90
