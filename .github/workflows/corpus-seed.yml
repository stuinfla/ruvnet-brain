name: corpus-seed-preparation

# This workflow is intentionally read-only. It prepares and seals an exact corpus candidate, then
# uploads it for the existing protected-release.yml authority. It cannot publish: release.mjs
# correctly rejects every workflow whose identity is not `protected-release`.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character SHA currently at origin/main
        required: true
        type: string
      seed_tag:
        description: Runtime seed override — the previous published generation; blank uses the committed bootstrap
        required: false
        type: string
      seed_sha256:
        description: Exact SHA-256 of the seed ruvnet-brain.zip (required with seed_tag)
        required: false
        type: string
      seed_bytes:
        description: Exact byte length of the seed ruvnet-brain.zip (required with seed_tag)
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      seed_tag:
        required: false
        type: string
      seed_sha256:
        required: false
        type: string
      seed_bytes:
        required: false
        type: string
    secrets:
      RUVNET_GISTS_TOKEN:
        description: Read-only gist-scoped token for per-gist detail fetches; optional, falls back to github.token
        required: false
    outputs:
      artifact_name:
        description: Exact-SHA preparation artifact for protected-release.yml
        value: ${{ jobs.prepare.outputs.artifact_name }}
      archive_sha256:
        description: SHA-256 of the newly prepared corpus candidate
        value: ${{ jobs.prepare.outputs.archive_sha256 }}
      receipt_sha256:
        description: SHA-256 of the sealed corpus receipt
        value: ${{ jobs.prepare.outputs.receipt_sha256 }}
      accuracy_sha256:
        description: SHA-256 of the detached retrieval-accuracy report bound to the candidate archive
        value: ${{ jobs.prepare.outputs.accuracy_sha256 }}
      seed_sha256:
        description: SHA-256 of the seed this round reconciled from (equal archive_sha256 means a no-change round)
        value: ${{ jobs.prepare.outputs.seed_sha256 }}

permissions:
  actions: read
  contents: read

concurrency:
  group: corpus-seed-preparation-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
      archive_sha256: ${{ steps.seal.outputs.archive_sha256 }}
      receipt_sha256: ${{ steps.seal.outputs.receipt_sha256 }}
      accuracy_sha256: ${{ steps.seal.outputs.accuracy_sha256 }}
      seed_sha256: ${{ steps.seal.outputs.seed_sha256 }}
    env:
      EXPECTED_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Reject ambiguous seed or source identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be 40 lowercase hex characters' >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact clean current main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo 'candidate checkout SHA mismatch' >&2; exit 1; }
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || { echo 'candidate is not current origin/main' >&2; exit 1; }
          test -z "$(git status --porcelain)" || { echo 'candidate checkout is dirty before reconciliation' >&2; exit 1; }

      - name: Bind this round to one exact seed identity
        env:
          INPUT_SEED_TAG: ${{ inputs.seed_tag }}
          INPUT_SEED_SHA256: ${{ inputs.seed_sha256 }}
          INPUT_SEED_BYTES: ${{ inputs.seed_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          # ADR-086 Step 15 / correction A6: the corpus receipt is schemaVersion 3, so a seed is now a
          # THREE-file identity — the archive, its receipt, and the DETACHED retrieval-accuracy report
          # that measured those exact archive bytes. A schema-2 seed carries no accuracy binding and is
          # unpublishable; requiring the descriptor to SAY schemaVersion 3 makes an older pointer fail
          # loudly here instead of being consumed as if it were still current. Re-pointing
          # data/corpus-seed.json at a schema-3 seed is ADR-086 Step 11's job.
          node -e "const s=require('./data/corpus-seed.json'); if(!/^[0-9a-f]{64}$/.test(s.sha256)||!Number.isSafeInteger(s.bytes)||s.bytes<1||!s.tag||s.asset!=='ruvnet-brain.zip'||s.schemaVersion!==3) process.exit(1)"
          # ADR-086 step 18: "Resolve the previous compatible, verified corpus generation at runtime as
          # the next seed; retain the committed exact seed as bootstrap/recovery input. Do not commit a
          # new pointer every night." A runtime override is therefore ALL-OR-NOTHING and fully
          # content-addressed — a tag without its digest and byte length would reintroduce exactly the
          # mutable-pointer seeding this design exists to remove.
          if [[ -n "${INPUT_SEED_TAG:-}" || -n "${INPUT_SEED_SHA256:-}" || -n "${INPUT_SEED_BYTES:-}" ]]; then
            if [[ -z "${INPUT_SEED_TAG:-}" || -z "${INPUT_SEED_SHA256:-}" || -z "${INPUT_SEED_BYTES:-}" ]]; then
              echo 'a runtime seed override must supply seed_tag, seed_sha256 and seed_bytes together' >&2; exit 1
            fi
            [[ "$INPUT_SEED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'seed_sha256 must be 64 lowercase hex characters' >&2; exit 1; }
            [[ "$INPUT_SEED_BYTES" =~ ^[1-9][0-9]*$ ]] || { echo 'seed_bytes must be a positive integer' >&2; exit 1; }
            [[ "$INPUT_SEED_TAG" != latest ]] || { echo 'seed_tag must never be the mutable latest pointer' >&2; exit 1; }
            RESOLVED_SEED_TAG="$INPUT_SEED_TAG"
            RESOLVED_SEED_SHA256="$INPUT_SEED_SHA256"
            RESOLVED_SEED_BYTES="$INPUT_SEED_BYTES"
            RESOLVED_SEED_ORIGIN=runtime-generation
          else
            RESOLVED_SEED_TAG="$(node -p "require('./data/corpus-seed.json').tag")"
            RESOLVED_SEED_SHA256="$(node -p "require('./data/corpus-seed.json').sha256")"
            RESOLVED_SEED_BYTES="$(node -p "require('./data/corpus-seed.json').bytes")"
            RESOLVED_SEED_ORIGIN=committed-bootstrap
          fi
          {
            echo "SEED_TAG=$RESOLVED_SEED_TAG"
            echo "SEED_SHA256=$RESOLVED_SEED_SHA256"
            echo "SEED_BYTES=$RESOLVED_SEED_BYTES"
            echo "SEED_ORIGIN=$RESOLVED_SEED_ORIGIN"
          } >> "$GITHUB_ENV"
          echo "seeding from $RESOLVED_SEED_ORIGIN $RESOLVED_SEED_TAG ($RESOLVED_SEED_SHA256)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install the exact lockfile dependency graph
        run: npm ci

      - name: Install kb deps (@ruvector/rvf and @xenova/transformers live here, not the root)
        run: cd kb && npm ci --no-audit --no-fund

      - name: Download the one configured immutable corpus seed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corpus-seed-download"
          # BOOTSTRAP DEADLOCK, measured 2026-09-14. Step 15 made the detached retrieval-accuracy
          # report a required seed asset unconditionally. But the ONLY producer of such a report is
          # this same workflow, and the configured bootstrap seed predates the contract: tag
          # v4.2.1-dev ships exactly two assets, ruvnet-brain.zip and ruvnet-brain.zip.sha256. So the
          # gate could never be satisfied by any seed that exists — the workflow failed HERE, before
          # it ever reached the gist fetch, and no rebuild could route around it.
          #
          # The seal's own vocabulary already distinguishes the two cases, so use it rather than
          # inventing a new flag: a seed MEASURED by this pipeline is published under the
          # digest-derived tag corpus-sha256-<sha256> (assertBootstrapIdentity, corpus-reconcile.mjs),
          # while the one hand-pinned bootstrap seed travels with --allow-pinned-seed-tag precisely
          # because it is the pre-contract origin. Require the report for the former, exempt the
          # latter. This is fail-closed for every seed this pipeline will ever produce: the moment
          # step 10 publishes a real corpus-sha256-<sha> seed, the report becomes mandatory again and
          # can never silently regress, because the exemption cannot name a digest-derived tag.
          # The exemption is keyed on the tag NOT claiming the digest-derived form at all. Testing
          # only `tag = corpus-sha256-$SEED_SHA256` would be fail-OPEN: a seed mis-tagged
          # corpus-sha256-<wrong> would fall into the exempt branch and skip the accuracy gate it is
          # supposed to be bound by. Measured 2026-09-14 — the first draft of this fix had exactly
          # that hole. So a tag that CLAIMS the digest form must match its own digest or the run dies
          # here; only a tag making no such claim is treated as the pre-contract bootstrap seed.
          case "$SEED_TAG" in
            corpus-sha256-*)
              if [ "$SEED_TAG" != "corpus-sha256-$SEED_SHA256" ]; then
                echo "FATAL: seed tag '$SEED_TAG' claims the digest-derived form but does not match" >&2
                echo "       its configured sha256 ($SEED_SHA256). A mis-tagged seed must never be" >&2
                echo "       treated as an exempt bootstrap seed." >&2
                exit 1
              fi
              SEED_IS_DIGEST_DERIVED=1
              ;;
            *)
              SEED_IS_DIGEST_DERIVED=0
              echo "NOTE: seed '$SEED_TAG' is the pre-contract pinned bootstrap seed; it carries no"
              echo "      retrieval-accuracy report and is exempt from that requirement. Every seed"
              echo "      published by this pipeline is tagged corpus-sha256-<sha256> and IS required"
              echo "      to carry one."
              ;;
          esac
          export SEED_IS_DIGEST_DERIVED
          gh release view "$SEED_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/corpus-seed-release.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/corpus-seed-release.json', 'utf8'));
          if (release.tagName !== process.env.SEED_TAG || release.isDraft) {
            throw new Error('configured corpus seed is absent, draft, or names another tag');
          }
          const required = process.env.SEED_IS_DIGEST_DERIVED === '1'
            ? ['ruvnet-brain.zip', 'ruvnet-brain.zip.accuracy.json']
            : ['ruvnet-brain.zip'];
          for (const asset of required) {
            const matches = (release.assets || []).filter(({ name }) => name === asset);
            if (matches.length !== 1) throw new Error(`configured corpus seed must carry exactly one ${asset}; found ${matches.length}`);
          }
          NODE
          gh release download "$SEED_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ruvnet-brain.zip' --dir "$RUNNER_TEMP/corpus-seed-download"
          if [ "$SEED_IS_DIGEST_DERIVED" = 1 ]; then
            gh release download "$SEED_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'ruvnet-brain.zip.accuracy.json' --dir "$RUNNER_TEMP/corpus-seed-download"
          fi
          test "$(find "$RUNNER_TEMP/corpus-seed-download" -maxdepth 1 -type f -name 'ruvnet-brain.zip' | wc -l | tr -d ' ')" = 1
          printf '%s  %s\n' "$SEED_SHA256" "$RUNNER_TEMP/corpus-seed-download/ruvnet-brain.zip" | sha256sum --check --strict
          test "$(stat -c %s "$RUNNER_TEMP/corpus-seed-download/ruvnet-brain.zip")" = "$SEED_BYTES"
          # "Reverify the downloaded final artifact against the measured identity." The seed's detached
          # accuracy report must bind the bytes just downloaded, and must be a complete, all-PASS
          # measurement — a bounded one is refused by the same reader the candidate seal uses.
          if [ "$SEED_IS_DIGEST_DERIVED" = 1 ]; then
          node --input-type=module <<'NODE'
          import { readAccuracyReport } from './scripts/oracle/retrieval-accuracy.mjs';
          import fs from 'node:fs';
          const bundle = `${process.env.RUNNER_TEMP}/corpus-seed-download/ruvnet-brain.zip`;
          readAccuracyReport({
            reportFile: `${bundle}.accuracy.json`,
            archive: { file: 'ruvnet-brain.zip', sha256: process.env.SEED_SHA256, bytes: fs.statSync(bundle).size },
          });
          console.log('seed retrieval-accuracy report verified against the downloaded seed bytes');
          NODE
          fi

      - name: Reconcile exact upstream SHAs and seal a candidate
        shell: bash
        env:
          # Actions' default GITHUB_TOKEN is a GitHub App token with no gist scope, so per-gist
          # detail fetches (scripts/gist-receipts.mjs's defaultFetchGist) 403 with "Resource not
          # accessible by integration" even though the list-level call (observeGists) already has
          # its own unauthenticated curl fallback (scripts/source-coverage.mjs, fixed separately).
          # Prefer a narrowly-scoped, read-only gist PAT when the repo secret is configured; fall
          # back to github.token so forks/environments without that secret keep prior behavior.
          GH_TOKEN: ${{ secrets.RUVNET_GISTS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-evidence"
          node scripts/corpus-reconcile.mjs \
            --root "$GITHUB_WORKSPACE" \
            --seed-archive "$RUNNER_TEMP/corpus-seed-download/ruvnet-brain.zip" \
            --seed-tag "$SEED_TAG" \
            --seed-sha256 "$SEED_SHA256" \
            --allow-pinned-seed-tag \
            --assets "$RUNNER_TEMP/corpus-assets" \
            --workspace "$RUNNER_TEMP/corpus-clones" \
            --coverage "$GITHUB_WORKSPACE/data/source-coverage.json" \
            --candidate-out "$RUNNER_TEMP/corpus-candidate/ruvnet-brain" \
            --receipt-out "$GITHUB_WORKSPACE/release-evidence/corpus-receipt.json" \
            --accuracy-oracle "$GITHUB_WORKSPACE/data/retrieval-accuracy-oracle.json" \
            --builder-sha "$EXPECTED_SHA" \
            --owner ruvnet | tee "$GITHUB_WORKSPACE/release-evidence/corpus-reconcile.log"

      - name: Record exact prepared identities
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/corpus-candidate/ruvnet-brain.zip"
          test -s release-evidence/corpus-receipt.json
          # ADR-086 Step 15: the detached accuracy report is a first-class candidate artifact. It is
          # produced beside the archive by prepareCorpusCandidate and MUST travel with it — without
          # it the receipt cannot be verified anywhere downstream.
          test -s "$RUNNER_TEMP/corpus-candidate/ruvnet-brain.zip.accuracy.json"
          archive_sha256="$(sha256sum "$RUNNER_TEMP/corpus-candidate/ruvnet-brain.zip" | cut -d' ' -f1)"
          receipt_sha256="$(sha256sum release-evidence/corpus-receipt.json | cut -d' ' -f1)"
          accuracy_sha256="$(sha256sum "$RUNNER_TEMP/corpus-candidate/ruvnet-brain.zip.accuracy.json" | cut -d' ' -f1)"
          node scripts/corpus-candidate.mjs --verify \
            --bundle "$RUNNER_TEMP/corpus-candidate/ruvnet-brain.zip" \
            --receipt release-evidence/corpus-receipt.json \
            --accuracy-report "$RUNNER_TEMP/corpus-candidate/ruvnet-brain.zip.accuracy.json"
          artifact_name="corpus-seed-prepared-$EXPECTED_SHA"
          {
            echo "artifact_name=$artifact_name"
            echo "archive_sha256=$archive_sha256"
            echo "receipt_sha256=$receipt_sha256"
            echo "accuracy_sha256=$accuracy_sha256"
            echo "seed_sha256=$SEED_SHA256"
          } >> "$GITHUB_OUTPUT"
          printf 'candidate_sha=%s\narchive_sha256=%s\nreceipt_sha256=%s\naccuracy_sha256=%s\nseed_tag=%s\nseed_sha256=%s\nseed_origin=%s\n' \
            "$EXPECTED_SHA" "$archive_sha256" "$receipt_sha256" "$accuracy_sha256" "$SEED_TAG" "$SEED_SHA256" "$SEED_ORIGIN" \
            > release-evidence/corpus-preparation.identity

      # ONE artifact root, outside the tracked tree. The previous upload mixed `$RUNNER_TEMP/...`
      # with workspace-relative paths, so actions/upload-artifact rooted the archive at their least
      # common ancestor (/home/runner/work) and every entry carried a runner-layout prefix that the
      # consumer could only guess at. Staging one flat directory makes the consumer's paths exact,
      # and keeps the ~500 MB payload out of the git checkout entirely.
      - name: Stage the sealed candidate outside the tracked tree
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/corpus-prepared"
          rm -rf "$staged"
          mkdir -p "$staged"
          mv "$RUNNER_TEMP/corpus-candidate/ruvnet-brain.zip" "$staged/ruvnet-brain.zip"
          # The detached report keeps the exact `<archive>.accuracy.json` name every reader resolves
          # by convention — the receipt carries only its basename, so renaming it here would break
          # verification everywhere downstream.
          mv "$RUNNER_TEMP/corpus-candidate/ruvnet-brain.zip.accuracy.json" "$staged/ruvnet-brain.zip.accuracy.json"
          cp release-evidence/corpus-receipt.json "$staged/corpus-receipt.json"
          cp release-evidence/corpus-reconcile.log "$staged/corpus-reconcile.log"
          cp release-evidence/corpus-preparation.identity "$staged/corpus-preparation.identity"
          cp data/source-coverage.json "$staged/source-coverage.json"
          cp docs/RUVNET-COVERAGE.md "$staged/RUVNET-COVERAGE.md"
          cp kb/PRIVATE-STORES.json "$staged/PRIVATE-STORES.json"
          test "$(sha256sum "$staged/ruvnet-brain.zip" | cut -d' ' -f1)" = "${{ steps.seal.outputs.archive_sha256 }}"
          test "$(sha256sum "$staged/corpus-receipt.json" | cut -d' ' -f1)" = "${{ steps.seal.outputs.receipt_sha256 }}"
          test "$(sha256sum "$staged/ruvnet-brain.zip.accuracy.json" | cut -d' ' -f1)" = "${{ steps.seal.outputs.accuracy_sha256 }}"

      - name: Upload exact candidate for protected-release.yml
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/corpus-prepared/

      - name: State the remaining authority boundary
        run: |
          echo 'Candidate prepared and sealed; NOT published.'
          echo 'protected-release.yml (mode=corpus) authenticates this run and this exact artifact through'
          echo 'the GitHub API, downloads it into RUNNER_TEMP only, re-verifies both digests, re-derives the'
          echo 'candidate from the archive bytes, proves every executable file equals the owner-approved'
          echo 'shipped runtime, crosses the corpus-only signing environment, and only then calls'
          echo 'node scripts/release.mjs --corpus-seed (the canonical publisher; see ADR-085/ADR-086).'
          echo 'This workflow holds no signing or publication authority of its own.'
