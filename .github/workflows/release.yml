name: release

# Quality gate for release artifacts: ensures both vitest and npm test pass before any
# release artifact can proceed to protected-release workflow.
#
# This workflow BLOCKS release if:
#  - vitest unit tests fail (test:unit gate)
#  - npm test comprehensive suite fails (full suite gate)
#
# Triggers:
#  - Manual dispatch: for testing the gate
#  - Tag push: v*.*.* tags (from release.mjs)
#  - PR to main: optional dry-run of gates

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/commit/tag) to test
        required: false
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  checks: write

concurrency:
  group: ruvnet-brain-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  test-gates:
    name: Release Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      test_unit_result: ${{ steps.test_unit.outcome }}
      test_npm_result: ${{ steps.test_npm.outcome }}
      status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts

      - name: 'Gate A: Run vitest unit tests'
        id: test_unit
        run: |
          set -euo pipefail
          echo "Running: npm run test:unit"
          npm run test:unit
        continue-on-error: false

      - name: 'Gate B: Run npm test (comprehensive suite)'
        id: test_npm
        run: |
          set -euo pipefail
          echo "Running: npm test"
          npm test
        continue-on-error: false

      - name: Report gate results
        if: always()
        run: |
          set +e
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Release Quality Gates — Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [[ "${{ steps.test_unit.outcome }}" == "success" ]]; then
            echo "✅ Gate A (vitest unit tests): PASSED"
          else
            echo "❌ Gate A (vitest unit tests): FAILED"
          fi

          if [[ "${{ steps.test_npm.outcome }}" == "success" ]]; then
            echo "✅ Gate B (npm test — comprehensive): PASSED"
          else
            echo "❌ Gate B (npm test — comprehensive): FAILED"
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Both gates must pass for release to proceed
          if [[ "${{ steps.test_unit.outcome }}" == "success" ]] && \
             [[ "${{ steps.test_npm.outcome }}" == "success" ]]; then
            echo "✅ ALL RELEASE GATES PASSED — Ready for downstream release workflow"
            exit 0
          else
            echo "❌ RELEASE GATES BLOCKED — One or more gates failed"
            exit 1
          fi

  # Downstream status check: only this job needs to pass for protected-release to proceed
  release-ready:
    name: Release Ready
    needs: test-gates
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Set release ready status
        run: |
          echo "✅ All release quality gates passed"
          echo "Artifact is ready for protected-release workflow"
