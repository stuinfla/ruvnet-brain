name: ci
# SEC-0010 #12 — the missing CI that let gate.sh (#1) and the run-tests regression (#3) ship unnoticed.
# Runs the brain-independent checks on every push/PR: version single-source-of-truth, structure,
# grounding-hook behavior, and the injection-guard unit test. None of these need the 512 MB bundle.
on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact release candidate SHA owned by the invoking preflight
        required: true
        type: string
      prepared_artifact_name:
        required: true
        type: string
      prepared_artifact_id:
        required: true
        type: string
      prepared_artifact_digest:
        required: true
        type: string
      prepared_archive_sha256:
        required: true
        type: string
      prepared_receipt_sha256:
        required: true
        type: string
      prepared_accuracy_sha256:
        required: true
        type: string
      prepared_recall_sha256:
        required: true
        type: string

concurrency:
  group: ruvnet-brain-ci-${{ github.event_name == 'workflow_call' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-preflight:
    name: candidate-preflight
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact candidate dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Validate changed release and grounding paths before the matrix
        run: |
          set -euo pipefail
          node --check scripts/release.mjs
          npm run version:check
          npm run release:authority

  # ADR-058 D1: the source-grounding guarantee must execute on a runner that has the exact
  # candidate's Brain and every embedder its RVF sidecars require.  A REQUIRE_BRAIN token in a
  # comment is not evidence; this job downloads the checked-in corpus seed, warms the same cache
  # inspected by plugin/test/run-tests.mjs, and runs the live MCP boundary with the hard flag.
  warm-brain:
    name: warm-brain
    needs: candidate-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install candidate test dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Restore the source-bound Brain seed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          seed_tag="$(node -p "require('./data/corpus-seed.json').tag")"
          seed_asset="$(node -p "require('./data/corpus-seed.json').asset")"
          seed_sha="$(node -p "require('./data/corpus-seed.json').sha256")"
          seed_bytes="$(node -p "require('./data/corpus-seed.json').bytes")"
          seed_dir="$RUNNER_TEMP/require-brain-seed"
          mkdir -p "$seed_dir/extracted"
          gh release download "$seed_tag" --repo "$GITHUB_REPOSITORY" --pattern "$seed_asset" --dir "$seed_dir"
          seed="$seed_dir/$seed_asset"
          test -s "$seed"
          test "$(sha256sum "$seed" | cut -d' ' -f1)" = "$seed_sha"
          test "$(stat -c %s "$seed")" = "$seed_bytes"
          unzip -q "$seed" -d "$seed_dir/extracted"
          mapfile -t kb_dirs < <(find "$seed_dir/extracted" -type f -name '*.big.rvf' ! -path '*/__MACOSX/*' -printf '%h\n' | LC_ALL=C sort -u)
          test "${#kb_dirs[@]}" -eq 1
          echo "RUVNET_BRAIN_KB=${kb_dirs[0]}" >> "$GITHUB_ENV"
          echo "KB_MODEL_CACHE=$RUNNER_TEMP/require-brain-models" >> "$GITHUB_ENV"
      - name: Install Brain reader dependencies
        run: npm ci --prefix "$RUVNET_BRAIN_KB" --no-audit --no-fund --ignore-scripts
      - name: Ensure the seeded reader has the current runtime dependencies
        run: |
          set -euo pipefail
          # The public seed is immutable and can predate the current reader package contract.
          # Install the runtime modules into the extracted seed before the live proof; this changes
          # only the disposable test checkout and cannot alter the signed seed bytes.
          npm install --prefix "$RUVNET_BRAIN_KB" --no-save --package-lock=false --ignore-scripts \
            @xenova/transformers@2.17.2 @ruvector/rvf@0.3.4
          # The immutable seed may carry an older resolver. Give every bundled reader the same
          # absolute module roots so the worker process and the warm-up probe resolve identical
          # bytes, regardless of where the seed was unpacked.
          echo "XENOVA_PATH=$RUVNET_BRAIN_KB/node_modules/@xenova/transformers" >> "$GITHUB_ENV"
          echo "RVF_MODULE_PATH=$RUVNET_BRAIN_KB/node_modules" >> "$GITHUB_ENV"
      - name: Explicitly warm every required embedder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$KB_MODEL_CACHE"
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';
          import { requiredEmbedderModels } from './plugin/test/model-cache.mjs';
          const modelCache = process.env.KB_MODEL_CACHE;
          const kb = process.env.RUVNET_BRAIN_KB;
          const requireFromKb = createRequire(path.join(kb, 'package.json'));
          const T = await import(pathToFileURL(requireFromKb.resolve('@xenova/transformers')).href);
          T.env.localModelPath = modelCache;
          T.env.cacheDir = modelCache;
          T.env.allowRemoteModels = true;
          for (const model of requiredEmbedderModels(process.env.RUVNET_BRAIN_KB)) {
            await T.pipeline('feature-extraction', model, { quantized: true });
          }
          NODE
      - name: Live source-grounding guarantee
        env:
          REQUIRE_BRAIN: '1'
          RUVNET_QE_LIVE: '1'
        run: |
          npx vitest run --config tests/qe/gpt56/vitest.config.mjs \
            tests/qe/gpt56/live-brain-search.test.mjs --reporter=dot

  release-acceptance-linux:
    needs: candidate-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Reviewed release acceptance (linux)
        run: node scripts/release-qualification.mjs --platform linux --report release-acceptance-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance-linux-${{ inputs.candidate_sha || github.sha }}
          path: release-acceptance-linux.json
          if-no-files-found: error

  release-acceptance-windows:
    needs: candidate-preflight
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve exact Git bytes before Windows checkout
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git config --global core.autocrlf false
          test "$(git config --global --get core.autocrlf)" = false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Reviewed release acceptance (windows)
        run: node scripts/release-qualification.mjs --platform windows --report release-acceptance-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance-windows-${{ inputs.candidate_sha || github.sha }}
          path: release-acceptance-windows.json
          if-no-files-found: error

  release-acceptance-macos:
    needs: candidate-preflight
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Reviewed release acceptance (macos)
        run: node scripts/release-qualification.mjs --platform macos --report release-acceptance-macos.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance-macos-${{ inputs.candidate_sha || github.sha }}
          path: release-acceptance-macos.json
          if-no-files-found: error

  release-qe:
    needs: candidate-preflight
    timeout-minutes: 40
    name: release-qe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact candidate dependencies
        run: npm ci --no-audit --no-fund
      - name: One protected publisher
        run: node scripts/release-authority.mjs
      - name: Version lockstep at source
        run: npm run version:check
      - name: Build the immutable npm candidate exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-evidence"
          npm pack --json --pack-destination "$RUNNER_TEMP/release-evidence" > "$RUNNER_TEMP/release-evidence/npm-pack.json"
          artifact="$RUNNER_TEMP/release-evidence/$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/release-evidence/npm-pack.json'))[0].filename")"
          test -s "$artifact"
          echo "RUVNET_SEALED_PACKAGE=$artifact" >> "$GITHUB_ENV"
      - name: Authenticate the same-run prepared corpus artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_ID: ${{ inputs.prepared_artifact_id }}
          PREPARED_NAME: ${{ inputs.prepared_artifact_name }}
          PREPARED_DIGEST: ${{ inputs.prepared_artifact_digest }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREPARED_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREPARED_ID" > "$RUNNER_TEMP/prepared-artifact.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e=process.env; const a=JSON.parse(fs.readFileSync(`${e.RUNNER_TEMP}/prepared-artifact.json`));
          const d=x=>String(x||'').replace(/^sha256:/,'');
          if(String(a.id)!==e.PREPARED_ID||a.name!==e.PREPARED_NAME||a.expired
            ||String(a.workflow_run?.id)!==e.GITHUB_RUN_ID||a.workflow_run?.head_sha!==e.EXPECTED_SHA
            ||!(/^[a-f0-9]{64}$/.test(d(e.PREPARED_DIGEST)))||d(a.digest)!==d(e.PREPARED_DIGEST))
            throw new Error('prepared corpus artifact identity differs from this candidate run');
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.prepared_artifact_id }}
          path: ${{ runner.temp }}/prepared-corpus
          merge-multiple: true
      - name: Verify and consume the immutable prepared corpus
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          ARCHIVE_SHA: ${{ inputs.prepared_archive_sha256 }}
          RECEIPT_SHA: ${{ inputs.prepared_receipt_sha256 }}
          ACCURACY_SHA: ${{ inputs.prepared_accuracy_sha256 }}
          RECALL_SHA: ${{ inputs.prepared_recall_sha256 }}
          RUVNET_MEASUREMENT_PUBLIC_KEY: ${{ vars.RUVNET_MEASUREMENT_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          prepared="$RUNNER_TEMP/prepared-corpus"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const e=process.env;const dir=`${e.RUNNER_TEMP}/prepared-corpus`;
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          for(const [name,expected] of [['ruvnet-brain.zip',e.ARCHIVE_SHA],['corpus-receipt.json',e.RECEIPT_SHA],
            ['ruvnet-brain.zip.accuracy.json',e.ACCURACY_SHA],['ruvnet-brain.zip.recall.json',e.RECALL_SHA]]) {
            if(!/^[a-f0-9]{64}$/.test(expected||'')||sha(`${dir}/${name}`)!==expected)throw new Error(`prepared bytes differ: ${name}`);
          }
          const seed=JSON.parse(fs.readFileSync(`${dir}/seed-identity.json`));
          const pinned=JSON.parse(fs.readFileSync('data/corpus-seed.json'));
          if(seed.origin!=='committed-bootstrap'||seed.tag!==pinned.tag||seed.sha256!==pinned.sha256||seed.bytes!==pinned.bytes
            ||sha(`${dir}/baseline-receipt.json`)!==seed.receiptSha256)
            throw new Error('prepared baseline differs from the exact configured seed');
          fs.appendFileSync(e.GITHUB_ENV,`RUVNET_SEED_BUNDLE=${e.RUNNER_TEMP}/release-seed/${pinned.asset}\n`);
          NODE
          node scripts/corpus-candidate.mjs --verify \
            --bundle "$prepared/ruvnet-brain.zip" --receipt "$prepared/corpus-receipt.json" \
            --accuracy-report "$prepared/ruvnet-brain.zip.accuracy.json" \
            --recall-report "$prepared/ruvnet-brain.zip.recall.json" \
            --expected-builder-sha "$EXPECTED_SHA" --expected-archive-sha256 "$ARCHIVE_SHA" \
            --expected-receipt-sha256 "$RECEIPT_SHA"
          mkdir -p "$RUNNER_TEMP/release-seed"
          seed_tag="$(node -p "require('./data/corpus-seed.json').tag")"
          seed_asset="$(node -p "require('./data/corpus-seed.json').asset")"
          gh release download "$seed_tag" --repo "$GITHUB_REPOSITORY" --pattern "$seed_asset" --dir "$RUNNER_TEMP/release-seed"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';
          import {extractZip} from './kb/zip-extract.mjs';
          import {validateCoverageDirectory} from './plugin/scripts/coverage-integrity.mjs';
          const e=process.env, prepared=path.join(e.RUNNER_TEMP,'prepared-corpus');
          const pinned=JSON.parse(fs.readFileSync('data/corpus-seed.json'));
          const seedFile=path.join(e.RUNNER_TEMP,'release-seed',pinned.asset);
          const hash=crypto.createHash('sha256').update(fs.readFileSync(seedFile)).digest('hex');
          if(hash!==pinned.sha256||fs.statSync(seedFile).size!==pinned.bytes)throw new Error('baseline archive bytes differ');
          if(fs.existsSync('dist/ruvnet-brain'))throw new Error('candidate extraction destination already exists');
          await extractZip(path.join(prepared,'ruvnet-brain.zip'),'dist');
          const check=validateCoverageDirectory('dist/ruvnet-brain',{
            expectedVersion:JSON.parse(fs.readFileSync('package.json')).version,
            expectedSourceSnapshot:e.EXPECTED_SHA,requireCompleteProfile:true});
          if(!check.valid)throw new Error(check.failures.join('; '));
          // Prepared observation is authoritative; the checkout observation may predate reconciliation.
          if(!fs.readFileSync(path.join(prepared,'source-coverage.json')).equals(fs.readFileSync('dist/ruvnet-brain/CORPUS-COVERAGE.json')))
            throw new Error('prepared coverage differs from the sealed corpus observation');
          const baseline=JSON.parse(fs.readFileSync(path.join(prepared,'seed-identity.json')));
          if(check.coverage.corpusSeed.receiptSha256!==baseline.receiptSha256
            ||check.coverage.corpusSeed.archiveSha256!==baseline.sha256
            ||check.coverage.corpusSeed.archiveBytes!==baseline.bytes||check.coverage.corpusSeed.tag!==baseline.tag)
            throw new Error('prepared corpus coverage baseline identity differs');
          NODE
          for file in ruvnet-brain.zip corpus-receipt.json ruvnet-brain.zip.accuracy.json ruvnet-brain.zip.recall.json; do
            cp "$prepared/$file" "$RUNNER_TEMP/release-evidence/$file"
          done
          cp "$prepared/baseline-receipt.json" "$RUNNER_TEMP/release-evidence/baseline-observation-receipt.json"
          # This member describes bootstrap input provenance; the bundle and ledger identify output.
          cp data/corpus-seed.json "$RUNNER_TEMP/release-evidence/corpus-seed.json"
          cp dist/ruvnet-brain/RVF-GENERATIONS.json "$RUNNER_TEMP/release-evidence/RVF-GENERATIONS.json"
          ( cd "$RUNNER_TEMP/release-evidence" && sha256sum ruvnet-brain.zip > ruvnet-brain.zip.sha256 )
      - name: Derive public verification inputs from exact candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s data/retrieval-query-evidence.json
          ORACLE_SOURCE_COMMIT="$(node -p "require('./data/retrieval-query-evidence.json').sourceCommit")"
          git fetch --no-tags origin "$ORACLE_SOURCE_COMMIT"
          node scripts/public-verification-inputs.mjs \
            --baseline-bundle "$RUVNET_SEED_BUNDLE" \
            --candidate-bundle "$RUNNER_TEMP/release-evidence/ruvnet-brain.zip" \
            --candidate-package "$RUVNET_SEALED_PACKAGE" \
            --oracle data/retrieval-query-evidence.json \
            --repo "$GITHUB_WORKSPACE" \
            --out-dir "$RUNNER_TEMP/release-evidence" \
            --observed-baseline
          # The deterministic historical observation must reproduce preparation's exact receipt.
          cmp "$RUNNER_TEMP/prepared-corpus/baseline-receipt.json" "$RUNNER_TEMP/release-evidence/baseline-observation-receipt.json"
      - name: Persist the canonical candidate payload manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-payload.mjs create \
            --version "$(node -p "require('./package.json').version")" \
            --tag "v$(node -p "require('./package.json').version")" \
            --sha "$GITHUB_SHA" \
            --member "npm=$RUVNET_SEALED_PACKAGE" \
            --member "bundle=$RUNNER_TEMP/release-evidence/ruvnet-brain.zip" \
            --member "corpus-seed=$RUNNER_TEMP/release-evidence/corpus-seed.json" \
            --member "generation-ledger=$RUNNER_TEMP/release-evidence/RVF-GENERATIONS.json" \
            --member "corpus-receipt=$RUNNER_TEMP/release-evidence/corpus-receipt.json" \
            --member "corpus-accuracy=$RUNNER_TEMP/release-evidence/ruvnet-brain.zip.accuracy.json" \
            --member "corpus-recall=$RUNNER_TEMP/release-evidence/ruvnet-brain.zip.recall.json" \
            --member "corpus-baseline=$RUNNER_TEMP/release-evidence/baseline-observation-receipt.json" \
            --out "$RUNNER_TEMP/release-evidence/payload-manifest.json" \
            | tee "$RUNNER_TEMP/release-evidence/payload-id.json"
      - name: Qualify the census against the exact staged candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { verifyRuntimeCensus } from './scripts/claims-verify.mjs';
          const evidence = path.join(process.env.RUNNER_TEMP, 'release-evidence');
          const payloadManifest = path.join(evidence, 'payload-manifest.json');
          const bytes = fs.readFileSync(payloadManifest);
          const manifest = JSON.parse(bytes);
          const { payloadId } = JSON.parse(fs.readFileSync(path.join(evidence, 'payload-id.json')));
          const result = await verifyRuntimeCensus({
            candidateKb: path.join(process.env.GITHUB_WORKSPACE, 'dist/ruvnet-brain'),
            candidateSha: manifest.candidateSha, candidateVersion: manifest.version,
            candidateRoot: process.env.GITHUB_WORKSPACE, payloadManifest, payloadId,
            qualificationMode: 'staged',
          });
          const receipt = { schemaVersion: 1, kind: 'ruvnet-brain-runtime-census-evidence',
            sourceSha: manifest.candidateSha, version: manifest.version, payloadId,
            runId: Number(process.env.GITHUB_RUN_ID),
            payloadManifestSha256: crypto.createHash('sha256').update(bytes).digest('hex'), result };
          fs.writeFileSync(path.join(evidence, 'runtime-census.json'), JSON.stringify(receipt, null, 2), { flag: 'wx' });
          console.log(JSON.stringify(receipt));
          if (result.status !== 'PASS' || result.diagnostic !== false || result.qualification !== 'staged-candidate') {
            throw new Error('Exact staged candidate census did not pass');
          }
          NODE
      - name: Install current hosts for candidate qualification
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "$RUNNER_TEMP/host-clis" \
            @anthropic-ai/claude-code@latest \
            @openai/codex@latest
          echo "$RUNNER_TEMP/host-clis/bin" >> "$GITHUB_PATH"
      - name: Claude-only, Codex-only, and dual-host candidate evidence (run once)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/step-watchdog.mjs --name candidate-host-evidence --timeout-ms 900000 -- \
            node scripts/candidate-host-evidence.mjs \
            --manifest "$RUNNER_TEMP/release-evidence/payload-manifest.json" \
            --package "$RUVNET_SEALED_PACKAGE" \
            --bundle "$RUNNER_TEMP/release-evidence/ruvnet-brain.zip" \
            --plan "$RUNNER_TEMP/release-evidence/retrieval-canary-plan.json" \
            --coverage "$RUNNER_TEMP/release-evidence/COVERAGE.json" \
            --out "$RUNNER_TEMP/release-evidence/candidate-host-evidence.json"
      - name: Exact-artifact release QE
        run: |
          node scripts/ci/step-watchdog.mjs --name exact-artifact-release-qe --timeout-ms 900000 -- \
            npm exec -- vitest run \
            --config tests/qe/release/vitest.config.mjs \
            --reporter=json \
            --outputFile="$RUNNER_TEMP/release-evidence/release-qe.json" \
            --maxWorkers=1
      - name: Seal the exact stabilization candidate
        run: |
          npm audit --audit-level=high --json > "$RUNNER_TEMP/release-evidence/npm-audit.json"
          node scripts/stabilization-receipt.mjs \
            --artifact "$RUVNET_SEALED_PACKAGE" \
            --qe "$RUNNER_TEMP/release-evidence/release-qe.json" \
            --audit "$RUNNER_TEMP/release-evidence/npm-audit.json" \
            --out "$RUNNER_TEMP/release-evidence/candidate-receipt.json"
      - name: Preserve candidate payload and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 30

  candidate-ci-evidence:
    name: candidate-ci-evidence
    needs: [candidate-preflight, release-acceptance-linux, release-acceptance-windows, release-acceptance-macos, release-qe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the exact candidate payload
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ inputs.candidate_sha || github.sha }}
          path: release-evidence
      - name: Restore reviewed platform acceptance reports
        uses: actions/download-artifact@v4
        with:
          pattern: release-acceptance-*-${{ inputs.candidate_sha || github.sha }}
          path: acceptance-reports
          merge-multiple: true
      - name: Bind every required CI job to the candidate payload
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-payload.mjs verify-members \
            --manifest release-evidence/payload-manifest.json > "$RUNNER_TEMP/payload.json"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const required = ['candidate-preflight', 'release-acceptance-linux', 'release-acceptance-windows', 'release-acceptance-macos', 'release-qe'];
          if (required.some((name) => needs[name]?.result !== 'success')) {
            throw new Error('candidate CI contains a non-success dependency');
          }
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/payload.json', 'utf8'));
          const manifestBytes = fs.readFileSync('release-evidence/payload-manifest.json');
          const manifest = JSON.parse(manifestBytes);
          const candidate = JSON.parse(fs.readFileSync('release-evidence/candidate-receipt.json', 'utf8'));
          if (manifest.candidateSha !== process.env.CANDIDATE_SHA || candidate.sha !== process.env.CANDIDATE_SHA) {
            throw new Error('candidate CI receipt identity differs from checked-out source');
          }
          const { validateQualificationReceipt } = await import('./scripts/release-qualification.mjs');
          const acceptanceReceipts = ['linux', 'macos', 'windows'].map(platform => {
            const bytes = fs.readFileSync(`acceptance-reports/release-acceptance-${platform}.json`);
            const report = JSON.parse(bytes);
            const tests = validateQualificationReceipt(report, { suite: 'source', platform, sourceSha: process.env.CANDIDATE_SHA });
            return { platform, sourceSha: report.source.sha, passed: tests.passed,
              receiptSha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          });
          const receipt = {
            acceptanceReceipts,
            schemaVersion: 1,
            kind: 'ruvnet-brain-candidate-ci-evidence',
            sourceSha: process.env.CANDIDATE_SHA,
            version: manifest.version,
            payloadId: payload.payloadId,
            payloadManifestSha256: crypto.createHash('sha256').update(manifestBytes).digest('hex'),
            workflow: 'ci',
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            jobs: required.map((name) => ({ name, conclusion: needs[name].result })),
            verdict: 'PASS',
            skipped: 0,
            unknown: 0,
          };
          fs.writeFileSync('candidate-ci-evidence.json', `${JSON.stringify(receipt, null, 2)}\n`, { flag: 'wx' });
          NODE
      - name: Persist the typed candidate CI receipt
        uses: actions/upload-artifact@v4
        with:
          name: candidate-ci-evidence-${{ inputs.candidate_sha || github.sha }}
          path: candidate-ci-evidence.json
          if-no-files-found: error
          retention-days: 90
