name: ci
# SEC-0010 #12 — the missing CI that let gate.sh (#1) and the run-tests regression (#3) ship unnoticed.
# Runs the brain-independent checks on every push/PR: version single-source-of-truth, structure,
# grounding-hook behavior, and the injection-guard unit test. None of these need the 512 MB bundle.
on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact current-main SHA owned by the protected release run
        required: true
        type: string

concurrency:
  group: ruvnet-brain-ci-${{ github.event_name == 'workflow_call' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-preflight:
    name: candidate-preflight
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact candidate dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Validate changed release and grounding paths before the matrix
        run: |
          set -euo pipefail
          node --check scripts/release.mjs
          npm run version:check
          npm run release:authority

  release-acceptance-linux:
    needs: candidate-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Reviewed release acceptance (linux)
        run: node scripts/release-qualification.mjs --platform linux --report release-acceptance-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance-linux-${{ inputs.candidate_sha || github.sha }}
          path: release-acceptance-linux.json
          if-no-files-found: error

  release-acceptance-windows:
    needs: candidate-preflight
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve exact Git bytes before Windows checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git config --global core.autocrlf false
          test "$(git config --global --get core.autocrlf)" = false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Reviewed release acceptance (windows)
        run: node scripts/release-qualification.mjs --platform windows --report release-acceptance-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance-windows-${{ inputs.candidate_sha || github.sha }}
          path: release-acceptance-windows.json
          if-no-files-found: error

  release-acceptance-macos:
    needs: candidate-preflight
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Reviewed release acceptance (macos)
        run: node scripts/release-qualification.mjs --platform macos --report release-acceptance-macos.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance-macos-${{ inputs.candidate_sha || github.sha }}
          path: release-acceptance-macos.json
          if-no-files-found: error

  release-qe:
    needs: candidate-preflight
    timeout-minutes: 40
    name: release-qe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact candidate dependencies
        run: npm ci --no-audit --no-fund
      - name: One protected publisher
        run: node scripts/release-authority.mjs
      - name: Version lockstep at source
        run: npm run version:check
      - name: Build the immutable npm candidate exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-evidence"
          npm pack --json --pack-destination "$RUNNER_TEMP/release-evidence" > "$RUNNER_TEMP/release-evidence/npm-pack.json"
          artifact="$RUNNER_TEMP/release-evidence/$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/release-evidence/npm-pack.json'))[0].filename")"
          test -s "$artifact"
          echo "RUVNET_SEALED_PACKAGE=$artifact" >> "$GITHUB_ENV"
      - name: Build the immutable knowledge bundle exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-seed/extracted"
          SEED_TAG="$(node -p "require('./data/corpus-seed.json').tag")"
          SEED_ASSET="$(node -p "require('./data/corpus-seed.json').asset")"
          SEED_SHA256="$(node -p "require('./data/corpus-seed.json').sha256")"
          SEED_BYTES="$(node -p "require('./data/corpus-seed.json').bytes")"
          gh release download "$SEED_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SEED_ASSET" --dir "$RUNNER_TEMP/release-seed"
          seed="$RUNNER_TEMP/release-seed/$SEED_ASSET"
          echo "RUVNET_SEED_BUNDLE=$seed" >> "$GITHUB_ENV"
          test "$(sha256sum "$seed" | cut -d' ' -f1)" = "$SEED_SHA256"
          test "$(stat -c %s "$seed")" = "$SEED_BYTES"
          unzip -q "$seed" -d "$RUNNER_TEMP/release-seed/extracted"
          mapfile -t asset_dirs < <(find "$RUNNER_TEMP/release-seed/extracted" -type f -name '*.big.rvf' ! -path '*/__MACOSX/*' ! -name '._*' -printf '%h\n' | LC_ALL=C sort -u)
          test "${#asset_dirs[@]}" -eq 1
          # --repair also re-seals stale ledger hashes after index persistence. The v4.2.1 seed
          # exposed three roots whose HNSW bytes had advanced after their ledger rows were written.
          node scripts/rvf-index-audit.mjs --dir "${asset_dirs[0]}" --repair
          # Do not re-observe GitHub here. GITHUB_TOKEN cannot read user gists (HTTP 403), and
          # release-QE must consume the checked-in, source-bound observation that was validated
          # when the corpus candidate was prepared. A separate credentialed refresh updates that
          # input; this publisher never silently substitutes a partial live observation.
          node scripts/public-verification-inputs.mjs observe-baseline \
            --baseline-bundle "$seed" --expected-tag "$SEED_TAG" --expected-sha256 "$SEED_SHA256" \
            --expected-bytes "$SEED_BYTES" --out "$RUNNER_TEMP/release-evidence/baseline-observation-receipt.json"
          node scripts/build-bundle.mjs --version "v$(node -p "require('./package.json').version")" --assets "${asset_dirs[0]}"
          baseline_receipt_sha256="$(sha256sum "$RUNNER_TEMP/release-evidence/baseline-observation-receipt.json" | cut -d' ' -f1)"
          node scripts/release-projection.mjs \
            --corpus data/source-coverage.json --assets dist/ruvnet-brain \
            --out "$RUNNER_TEMP/release-projection" \
            --version "$(node -p "require('./package.json').version")" --source-snapshot "$GITHUB_SHA" \
            --baseline-receipt-sha256 "$baseline_receipt_sha256" --seed-tag "$SEED_TAG" \
            --seed-sha256 "$SEED_SHA256" --seed-bytes "$SEED_BYTES"
          node scripts/build-bundle.mjs --version "v$(node -p "require('./package.json').version")" \
            --assets "${asset_dirs[0]}" --coverage "$RUNNER_TEMP/release-projection/COVERAGE.json" \
            --projection "$RUNNER_TEMP/release-projection"
          cp dist/ruvnet-brain.zip "$RUNNER_TEMP/release-evidence/ruvnet-brain.zip"
          cp data/corpus-seed.json "$RUNNER_TEMP/release-evidence/corpus-seed.json"
          cp dist/ruvnet-brain/RVF-GENERATIONS.json "$RUNNER_TEMP/release-evidence/RVF-GENERATIONS.json"
          # THE SIDECAR MUST NAME THE FILE, NOT THE MACHINE THAT BUILT IT (fixed 2026-08-07, #77).
          #
          # This was `sha256sum "$RUNNER_TEMP/.../ruvnet-brain.zip" > ...sha256`, and sha256sum writes
          # the path it was GIVEN into the file, so the sidecar shipped as:
          #     a35724de…  /home/runner/work/_temp/release-evidence/ruvnet-brain.zip
          # Two consequences, one fatal. For a user, `shasum -c` then looks for a file at a CI
          # runner's temp path that does not exist on their machine — the sidecar cannot verify the
          # download it exists to verify. For the release rail, the sidecar's OWN sha256 becomes
          # environment-dependent, so `assetsExact` compared it against a digest sealed elsewhere and
          # failed every time with `staged GitHub payload mismatch`. That was the last thing standing
          # between #77 and a convergent release, after the aborted-state deadlock was cleared.
          #
          # `cd` first so the recorded name is the bare basename — identical to what
          # scripts/sign-bundle.mjs:59 writes (`${digest}  ${path.basename(bundle)}`), which is the
          # format the verifier and every user's `shasum -c` both expect.
          ( cd "$RUNNER_TEMP/release-evidence" && sha256sum ruvnet-brain.zip > ruvnet-brain.zip.sha256 )
      - name: Derive public verification inputs from exact candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s data/retrieval-query-evidence.json
          ORACLE_SOURCE_COMMIT="$(node -p "require('./data/retrieval-query-evidence.json').sourceCommit")"
          git fetch --no-tags origin "$ORACLE_SOURCE_COMMIT"
          node scripts/public-verification-inputs.mjs \
            --baseline-bundle "$RUVNET_SEED_BUNDLE" \
            --candidate-bundle "$RUNNER_TEMP/release-evidence/ruvnet-brain.zip" \
            --candidate-package "$RUVNET_SEALED_PACKAGE" \
            --oracle data/retrieval-query-evidence.json \
            --repo "$GITHUB_WORKSPACE" \
            --out-dir "$RUNNER_TEMP/release-evidence" \
            --observed-baseline
      - name: Persist the canonical candidate payload manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-payload.mjs create \
            --version "$(node -p "require('./package.json').version")" \
            --tag "v$(node -p "require('./package.json').version")" \
            --sha "$GITHUB_SHA" \
            --member "npm=$RUVNET_SEALED_PACKAGE" \
            --member "bundle=$RUNNER_TEMP/release-evidence/ruvnet-brain.zip" \
            --member "corpus-seed=$RUNNER_TEMP/release-evidence/corpus-seed.json" \
            --member "generation-ledger=$RUNNER_TEMP/release-evidence/RVF-GENERATIONS.json" \
            --out "$RUNNER_TEMP/release-evidence/payload-manifest.json" \
            | tee "$RUNNER_TEMP/release-evidence/payload-id.json"
      - name: Qualify the census against the exact staged candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { verifyRuntimeCensus } from './scripts/claims-verify.mjs';
          const evidence = path.join(process.env.RUNNER_TEMP, 'release-evidence');
          const payloadManifest = path.join(evidence, 'payload-manifest.json');
          const bytes = fs.readFileSync(payloadManifest);
          const manifest = JSON.parse(bytes);
          const { payloadId } = JSON.parse(fs.readFileSync(path.join(evidence, 'payload-id.json')));
          const result = await verifyRuntimeCensus({
            candidateKb: path.join(process.env.GITHUB_WORKSPACE, 'dist/ruvnet-brain'),
            candidateSha: manifest.candidateSha, candidateVersion: manifest.version,
            candidateRoot: process.env.GITHUB_WORKSPACE, payloadManifest, payloadId,
            qualificationMode: 'staged',
          });
          const receipt = { schemaVersion: 1, kind: 'ruvnet-brain-runtime-census-evidence',
            sourceSha: manifest.candidateSha, version: manifest.version, payloadId,
            runId: Number(process.env.GITHUB_RUN_ID),
            payloadManifestSha256: crypto.createHash('sha256').update(bytes).digest('hex'), result };
          fs.writeFileSync(path.join(evidence, 'runtime-census.json'), JSON.stringify(receipt, null, 2), { flag: 'wx' });
          console.log(JSON.stringify(receipt));
          if (result.status !== 'PASS' || result.diagnostic !== false || result.qualification !== 'staged-candidate') {
            throw new Error('Exact staged candidate census did not pass');
          }
          NODE
      - name: Install current hosts and global Ruflo for candidate qualification
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "$RUNNER_TEMP/host-clis" \
            @anthropic-ai/claude-code@latest \
            @openai/codex@latest
          npm install --global --prefix "$HOME/.npm-global" ruflo@latest
          "$HOME/.npm-global/bin/ruflo" --version
          echo "$RUNNER_TEMP/host-clis/bin" >> "$GITHUB_PATH"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      - name: Qualify interrupted cross-host continuity using the sealed package
        env:
          RUFLO_DAEMON_AUTOSTART: '0'
          TMPDIR: ${{ runner.temp }}/release-evidence
        run: |
          set -euo pipefail
          test -s "$RUVNET_SEALED_PACKAGE"
          node scripts/qa-runner.mjs --release --lane continuity
      - name: Claude-only, Codex-only, and dual-host candidate evidence (run once)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/step-watchdog.mjs --name candidate-host-evidence --timeout-ms 900000 -- \
            node scripts/candidate-host-evidence.mjs \
            --manifest "$RUNNER_TEMP/release-evidence/payload-manifest.json" \
            --package "$RUVNET_SEALED_PACKAGE" \
            --bundle "$RUNNER_TEMP/release-evidence/ruvnet-brain.zip" \
            --plan "$RUNNER_TEMP/release-evidence/retrieval-canary-plan.json" \
            --coverage "$RUNNER_TEMP/release-evidence/COVERAGE.json" \
            --out "$RUNNER_TEMP/release-evidence/candidate-host-evidence.json"
      - name: Exact-artifact release QE
        run: |
          node scripts/ci/step-watchdog.mjs --name exact-artifact-release-qe --timeout-ms 900000 -- \
            npm exec -- vitest run \
            --config tests/qe/release/vitest.config.mjs \
            --reporter=json \
            --outputFile="$RUNNER_TEMP/release-evidence/release-qe.json" \
            --maxWorkers=1
      - name: Seal the exact stabilization candidate
        run: |
          npm audit --audit-level=high --json > "$RUNNER_TEMP/release-evidence/npm-audit.json"
          node scripts/stabilization-receipt.mjs \
            --artifact "$RUVNET_SEALED_PACKAGE" \
            --qe "$RUNNER_TEMP/release-evidence/release-qe.json" \
            --audit "$RUNNER_TEMP/release-evidence/npm-audit.json" \
            --out "$RUNNER_TEMP/release-evidence/candidate-receipt.json"
      - name: Preserve candidate payload and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 30

  candidate-ci-evidence:
    name: candidate-ci-evidence
    needs: [candidate-preflight, release-acceptance-linux, release-acceptance-windows, release-acceptance-macos, release-qe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the exact candidate payload
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ inputs.candidate_sha || github.sha }}
          path: release-evidence
      - name: Restore reviewed platform acceptance reports
        uses: actions/download-artifact@v4
        with:
          pattern: release-acceptance-*-${{ inputs.candidate_sha || github.sha }}
          path: acceptance-reports
          merge-multiple: true
      - name: Bind every required CI job to the candidate payload
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          NEEDS_JSON: ${{ toJson(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-payload.mjs verify-members \
            --manifest release-evidence/payload-manifest.json > "$RUNNER_TEMP/payload.json"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const required = ['candidate-preflight', 'release-acceptance-linux', 'release-acceptance-windows', 'release-acceptance-macos', 'release-qe'];
          if (required.some((name) => needs[name]?.result !== 'success')) {
            throw new Error('candidate CI contains a non-success dependency');
          }
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/payload.json', 'utf8'));
          const manifestBytes = fs.readFileSync('release-evidence/payload-manifest.json');
          const manifest = JSON.parse(manifestBytes);
          const candidate = JSON.parse(fs.readFileSync('release-evidence/candidate-receipt.json', 'utf8'));
          if (manifest.candidateSha !== process.env.CANDIDATE_SHA || candidate.sha !== process.env.CANDIDATE_SHA) {
            throw new Error('candidate CI receipt identity differs from checked-out source');
          }
          const { validateQualificationReceipt } = await import('./scripts/release-qualification.mjs');
          const acceptanceReceipts = ['linux', 'macos', 'windows'].map(platform => {
            const bytes = fs.readFileSync(`acceptance-reports/release-acceptance-${platform}.json`);
            const report = JSON.parse(bytes);
            const tests = validateQualificationReceipt(report, { suite: 'source', platform, sourceSha: process.env.CANDIDATE_SHA });
            return { platform, sourceSha: report.source.sha, passed: tests.passed,
              receiptSha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          });
          const receipt = {
            acceptanceReceipts,
            schemaVersion: 1,
            kind: 'ruvnet-brain-candidate-ci-evidence',
            sourceSha: process.env.CANDIDATE_SHA,
            version: manifest.version,
            payloadId: payload.payloadId,
            payloadManifestSha256: crypto.createHash('sha256').update(manifestBytes).digest('hex'),
            workflow: 'ci',
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            jobs: required.map((name) => ({ name, conclusion: needs[name].result })),
            verdict: 'PASS',
            skipped: 0,
            unknown: 0,
          };
          fs.writeFileSync('candidate-ci-evidence.json', `${JSON.stringify(receipt, null, 2)}\n`, { flag: 'wx' });
          NODE
      - name: Persist the typed candidate CI receipt
        uses: actions/upload-artifact@v4
        with:
          name: candidate-ci-evidence-${{ inputs.candidate_sha || github.sha }}
          path: candidate-ci-evidence.json
          if-no-files-found: error
          retention-days: 90
