name: protected-release

# The candidate CI produces one immutable package + receipt. This workflow proves that exact
# candidate is current main, carries it across the branch-protected Production boundary, and is
# the only workflow allowed to invoke the publisher.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA currently at origin/main
        required: true
        type: string
      version:
        description: Exact release generation (must equal package.json at candidate_sha)
        required: true
        type: string
      release_qe_run_id:
        description: Successful exact-SHA ci run that uploaded release-evidence
        required: true
        type: string
      aggregate_run_id:
        description: Successful exact-SHA release-aggregate run
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: ruvnet-brain-release
  cancel-in-progress: false

env:
  # NOT a hardcoded version. This was `EXPECTED_VERSION: 4.0.8`, which pinned the ONLY workflow
  # allowed to sign and publish to a single generation — so 4.0.9 and 4.0.10 could not be released
  # by the release rail at all, and every release after 4.0.8 was done by hand or by "emergency
  # promotion". That is the whole reason the release process has felt broken: the publisher was
  # version-locked in a literal, the same one-fact-stated-twice defect as everywhere else.
  #
  # The generation is now DERIVED from package.json at the candidate SHA, and the dispatch input is
  # checked against it. The safety property is unchanged and actually stronger: it used to assert
  # "matches the literal someone last edited", it now asserts "the version you asked to release is
  # the version that commit actually is".
  #
  # THE RENAME ABOVE SHIPPED HALF-DONE, AND IT BRICKED THE PUBLISHER (found 2026-08-06).
  # `EXPECTED_VERSION: 4.0.8` was replaced with `REQUESTED_VERSION` here, but the five USES kept the
  # old name (lines 64, 158, 171, 174, 175). Every one of those runs under `set -euo pipefail` or
  # reads `process.env.EXPECTED_VERSION`, so the first check aborted on an unbound variable before it
  # could compare anything — this workflow, the ONLY path allowed to sign and publish, could not
  # complete a release at all. Unpinning the version and disabling the publisher landed in the same
  # commit (`da42a21`), so "the release rail is fixed" and "no release can run" were true together.
  #
  # That is the source of #77, not a symptom of it: with the rail dead, every release since was done
  # by hand, and hand-releases are exactly how npm and GitHub came to name different generations.
  # The name is now defined once, where it is used.
  EXPECTED_VERSION: ${{ inputs.version }}
  EXPECTED_SHA: ${{ inputs.candidate_sha }}

jobs:
  release-qe-proof:
    name: release-qe-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Reject malformed or wrong-generation dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate SHA must be 40 lowercase hex characters' >&2; exit 1; }
          [[ "${{ inputs.version }}" == "$EXPECTED_VERSION" ]] || { echo 'candidate version mismatch' >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the candidate to be the current immutable main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo 'candidate checkout SHA mismatch' >&2; exit 1; }
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || { echo 'candidate is not current origin/main' >&2; exit 1; }
          test -z "$(git status --porcelain)" || { echo 'candidate checkout is dirty' >&2; exit 1; }

      - name: Require zero maintainer-governed release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          blockers="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-blocker --limit 100 --json number --jq 'length')"
          test "$blockers" -eq 0 || { echo "$blockers governed release blocker(s) remain open" >&2; exit 1; }

      - name: Prove exact-SHA CI and release-qe completed successfully
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_QE_RUN_ID: ${{ inputs.release_qe_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RELEASE_QE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,workflowName,headSha,status,conclusion,jobs > "$RUNNER_TEMP/release-qe-run.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/release-qe-run.json', 'utf8'));
          const ok = run.workflowName === 'ci'
            && run.headSha === process.env.EXPECTED_SHA
            && run.status === 'completed'
            && run.conclusion === 'success'
            && run.jobs?.some(({ name, status, conclusion }) => name === 'release-qe'
              && status === 'completed' && conclusion === 'success');
          if (!ok) throw new Error('release-qe proof is absent, red, pending, or bound to another SHA');
          NODE

      - name: Download CI-produced candidate receipt and sealed package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_qe_run_id }}
          name: release-evidence-${{ inputs.candidate_sha }}
          path: release-evidence

      - name: Download the sole exact-SHA aggregate envelope
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.aggregate_run_id }}
          name: release-aggregate-${{ inputs.candidate_sha }}
          path: release-evidence

      - name: Authenticate the aggregate workflow and exact-SHA job
        env:
          GH_TOKEN: ${{ github.token }}
          AGGREGATE_RUN_ID: ${{ inputs.aggregate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$AGGREGATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headSha,status,conclusion,jobs > "$RUNNER_TEMP/aggregate-run.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/aggregate-run.json', 'utf8'));
          if (run.workflowName !== 'release-aggregate' || run.headSha !== process.env.EXPECTED_SHA
            || run.status !== 'completed' || run.conclusion !== 'success'
            || !run.jobs?.some((job) => job.name === 'release-aggregate'
              && job.status === 'completed' && job.conclusion === 'success')) {
            throw new Error('aggregate workflow proof is absent, red, pending, or bound to another SHA');
          }
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify machine-produced receipt, package bytes, and version lockstep
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test -s release-evidence/candidate-receipt.json
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION" || { echo 'candidate version mismatch' >&2; exit 1; }
          node scripts/release-proof.mjs --candidate release-evidence/candidate-receipt.json
          node scripts/release-payload.mjs verify-members --manifest release-evidence/payload-manifest.json > "$RUNNER_TEMP/payload.json"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const receipt = JSON.parse(fs.readFileSync('release-evidence/candidate-receipt.json', 'utf8'));
          const aggregate = JSON.parse(fs.readFileSync('release-evidence/aggregate-envelope.json', 'utf8'));
          const leaves = JSON.parse(fs.readFileSync('release-evidence/release-leaves.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('release-evidence/payload-manifest.json', 'utf8'));
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/payload.json', 'utf8'));
          if (receipt.sha !== process.env.EXPECTED_SHA) throw new Error('candidate receipt SHA mismatch');
          if (receipt.version !== process.env.EXPECTED_VERSION) throw new Error('candidate version mismatch');
          if (aggregate.verdict !== 'PASS' || aggregate.sha !== process.env.EXPECTED_SHA
            || aggregate.payloadId !== payload.payloadId) throw new Error('aggregate envelope identity mismatch');
          if (manifest.candidateSha !== process.env.EXPECTED_SHA || manifest.version !== process.env.EXPECTED_VERSION
            || manifest.tag !== `v${process.env.EXPECTED_VERSION}`) throw new Error('payload manifest source identity mismatch');
          const roles = new Set(manifest.members?.map((member) => member.role));
          if (!roles.has('npm') || !roles.has('bundle') || !roles.has('corpus-seed')
            || !roles.has('generation-ledger') || roles.size !== 4) throw new Error('payload manifest roles are incomplete or ambiguous');
          const relative = String(receipt.artifact?.path || '').replaceAll('\\', '/');
          if (!relative.startsWith('release-evidence/') || relative.includes('../')) throw new Error('candidate artifact path escaped release-evidence');
          const artifact = path.resolve(relative);
          const digest = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (digest !== String(receipt.artifact.sha256).replace(/^sha256:/, '')) throw new Error('candidate artifact digest mismatch');
          const npmMember = manifest.members.find((member) => member.role === 'npm');
          if (npmMember.sha256 !== digest || npmMember.name !== path.basename(artifact)) throw new Error('payload npm member differs from candidate seal');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate_sha=${receipt.sha}\nartifact_sha256=${digest}\nversion=${receipt.version}\n`);
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { aggregateEvidence } from './scripts/release-evidence-aggregate.mjs';
          const envelope = JSON.parse(fs.readFileSync('release-evidence/aggregate-envelope.json', 'utf8'));
          const leaves = JSON.parse(fs.readFileSync('release-evidence/release-leaves.json', 'utf8'));
          const recomputed = aggregateEvidence({ sha: envelope.sha, payloadId: envelope.payloadId, leaves });
          // CANONICAL comparison, not raw JSON.stringify (fixed 2026-08-06).
          //
          // `JSON.stringify` preserves KEY INSERTION ORDER, so this compared spelling, not content.
          // Measured against the real 4.0.18 evidence: the stored envelope carries alphabetically
          // sorted keys while aggregateEvidence() returns them in construction order, so the two
          // serialise differently while being the same object —
          //     evidenceDigest equal : true
          //     verdict equal        : true
          //     canonical equal      : true
          //     raw stringify equal  : FALSE   ← the only thing the old line could see
          // and the release was refused with 'aggregate envelope digest or leaves mismatch' when
          // nothing was mismatched. A gate that reports something other than what it measures is
          // the defect this repo keeps paying for; here it made the publisher unable to accept its
          // own correctly-produced evidence, which is the last thing standing between #77 and a
          // convergent release.
          //
          // The security property is UNCHANGED, and is in fact now checked twice: any real change
          // to the leaves alters both the canonical form AND evidenceDigest (a sha256 over the
          // leaves, recomputed here from the shipped file). Sorting keys cannot hide a substituted
          // value, a dropped leaf, or an added one.
          const canonical = (value) => (Array.isArray(value)
            ? value.map(canonical)
            : (value && typeof value === 'object')
              ? Object.fromEntries(Object.keys(value).sort().map((k) => [k, canonical(value[k])]))
              : value);
          if (recomputed.evidenceDigest !== envelope.evidenceDigest) throw new Error('aggregate evidence digest mismatch');
          if (JSON.stringify(canonical(recomputed)) !== JSON.stringify(canonical(envelope))) throw new Error('aggregate envelope leaves mismatch');
          NODE

  seal-payload:
    name: seal-or-reuse-immutable-payload
    needs: release-qe-proof
    runs-on: ubuntu-latest
    environment: Production – ruvnet-brain
    permissions:
      actions: write
      contents: read
    outputs:
      payload_id: ${{ steps.seal.outputs.payload_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-qe-proof.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore the original build-once candidate payload
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_qe_run_id }}
          name: release-evidence-${{ needs.release-qe-proof.outputs.candidate_sha }}
          path: release-evidence
      - name: Restore the exact-SHA aggregate envelope
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.aggregate_run_id }}
          name: release-aggregate-${{ needs.release-qe-proof.outputs.candidate_sha }}
          path: release-evidence
      - name: Reuse persisted signature or sign exactly once
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
          RUVNET_SIGNING_KEY: ${{ secrets.RUVNET_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned_proof="$(node scripts/release-payload.mjs verify-members --manifest release-evidence/payload-manifest.json)"
          payload_id="$(node -p "JSON.parse(process.argv[1]).payloadId" "$unsigned_proof")"
          artifact_name="signed-payload-$payload_id"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/signed-payload.zip"
            mkdir -p "$RUNNER_TEMP/reused-signatures"
            unzip -qo "$RUNNER_TEMP/signed-payload.zip" -d "$RUNNER_TEMP/reused-signatures"
            cp "$RUNNER_TEMP/reused-signatures/payload-manifest.sig" release-evidence/payload-manifest.sig
            cp "$RUNNER_TEMP/reused-signatures/ruvnet-brain.zip.sig" release-evidence/ruvnet-brain.zip.sig
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sign-bundle.mjs --bundle release-evidence/ruvnet-brain.zip
            node scripts/release-payload.mjs sign \
              --manifest release-evidence/payload-manifest.json \
              --out release-evidence/payload-manifest.sig
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
          proof="$(node scripts/release-payload.mjs verify \
            --manifest release-evidence/payload-manifest.json \
            --signature release-evidence/payload-manifest.sig \
            --public-key keys/ruvnet-brain-signing.pub.pem)"
          node scripts/verify-bundle.mjs release-evidence/ruvnet-brain.zip release-evidence/ruvnet-brain.zip.sig
          test "$(node -p "JSON.parse(process.argv[1]).payloadId" "$proof")" = "$payload_id"
          echo "payload_id=$payload_id" >> "$GITHUB_OUTPUT"
      - name: Persist the one signed payload across retries
        if: steps.seal.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-payload-${{ steps.seal.outputs.payload_id }}
          path: |
            release-evidence/payload-manifest.json
            release-evidence/payload-manifest.sig
            release-evidence/ruvnet-brain-*.tgz
            release-evidence/ruvnet-brain.zip
            release-evidence/ruvnet-brain.zip.sig
            release-evidence/ruvnet-brain.zip.sha256
            release-evidence/corpus-seed.json
            release-evidence/RVF-GENERATIONS.json
            release-evidence/candidate-receipt.json
            release-evidence/aggregate-envelope.json
          if-no-files-found: error
          retention-days: 90

      - name: Hand the verified payload to this run's publisher
        uses: actions/upload-artifact@v4
        with:
          name: publisher-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-evidence/payload-manifest.json
            release-evidence/payload-manifest.sig
            release-evidence/ruvnet-brain-*.tgz
            release-evidence/ruvnet-brain.zip
            release-evidence/ruvnet-brain.zip.sig
            release-evidence/ruvnet-brain.zip.sha256
            release-evidence/corpus-seed.json
            release-evidence/RVF-GENERATIONS.json
            release-evidence/candidate-receipt.json
            release-evidence/aggregate-envelope.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: protected-publisher
    needs: [release-qe-proof, seal-payload]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production – ruvnet-brain
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-qe-proof.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Install candidate and current host CLIs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --global --prefix "$RUNNER_TEMP/host-clis" \
            @anthropic-ai/claude-code@latest \
            @openai/codex@latest
          echo "$RUNNER_TEMP/host-clis/bin" >> "$GITHUB_PATH"

      - name: Restore the persisted signed payload (never rebuild or resign)
        uses: actions/download-artifact@v4
        with:
          name: publisher-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence

      - name: Publish the CI-sealed candidate through the one canonical transaction
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RUVNET_SIGNING_KEY: ${{ secrets.RUVNET_SIGNING_KEY }}
          RUVNET_RELEASE_MODE: stabilization
          RUVNET_CANDIDATE_RECEIPT: release-evidence/candidate-receipt.json
          RUVNET_CANDIDATE_PAYLOAD: release-evidence/payload-manifest.json
          RUVNET_CANDIDATE_PAYLOAD_SIGNATURE: release-evidence/payload-manifest.sig
          RUVNET_AGGREGATE_ENVELOPE: release-evidence/aggregate-envelope.json
          RUVNET_EXPECTED_SHA: ${{ needs.release-qe-proof.outputs.candidate_sha }}
          RUVNET_EXPECTED_ARTIFACT_SHA256: ${{ needs.release-qe-proof.outputs.artifact_sha256 }}
          RUVNET_EXPECTED_VERSION: ${{ needs.release-qe-proof.outputs.version }}
          RUVNET_PUBLICATION_RECEIPT: release-evidence/publication-receipt.json
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RUVNET_EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$RUVNET_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          node scripts/release.mjs --publish

      - name: Require the machine-generated publication seal
        shell: bash
        run: |
          set -euo pipefail
          test -s release-evidence/publication-receipt.json
          node scripts/release-proof.mjs \
            --candidate release-evidence/candidate-receipt.json \
            --publication release-evidence/publication-receipt.json

      - name: Preserve both append-only receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence-${{ needs.release-qe-proof.outputs.candidate_sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
