name: canonical-qa

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: ruvnet-brain-canonical-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-development:
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/release-qualification.mjs --suite source --report /tmp/source-qualification.json

  # WORK-REGISTER #26: every PR to main runs the WHOLE vitest suite and blocks on red. The reviewed
  # source suite above is 26 files; the other ~560 test files ran in no automatic gate, so a red test
  # (corpus-canary's BREAK-IT, v4.3.40) sat on main unseen. scripts/full-suite-gate.mjs fails on any
  # red not in tests/known-red.json (each entry has a class, evidence and owner), on a quarantined test
  # that now passes, and on any test file that vitest's include silently never runs.
  # Runtime (measured locally 2026-10-01, maxWorkers 1 per vitest.config.mjs): 29.5 min of summed file
  # time, 35 min wall including the retry, on an M3 Max at load ~100. A 4-vCPU ubuntu runner is slower
  # per core; 120 min leaves room for a 2x slowdown plus install. Not yet measured on GitHub.
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix kb --no-audit --no-fund
      # The continuity and managed-CLI tests drive the REAL global ruflo and refuse to skip vacuously
      # without it (probe PR #357: 13 reds, "global Ruflo is required"). Install it the way customers
      # do: the global package, latest, never pinned, never via npx; prove which one runs.
      - name: Install the global ruflo customers run
        run: |
          npm install -g ruflo@latest --no-audit --no-fund
          command -v ruflo
          ruflo --version
      # tests/acceptance/rnbc-every-element drives a real headless Chromium through every element of the
      # console (docs/qa/rnbc-ledger.md); a runner without the browser fails that file, so install it.
      - name: Install the browser the console QA drives
        run: npx playwright install --with-deps chromium
      - run: node scripts/full-suite-gate.mjs
      - run: node --test tests/experience/report.test.mjs

  canonical-qa:
    name: canonical-qa
    if: always()
    needs: [qualify-development, full-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require development qualification
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          QUALIFICATION_RESULT: ${{ needs.qualify-development.result }}
        run: test "$QUALIFICATION_RESULT" = success
      - name: Require the full suite
        env:
          FULL_SUITE_RESULT: ${{ needs.full-suite.result }}
        run: test "$FULL_SUITE_RESULT" = success
      - name: Verify already-qualified release source
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/qualified-candidate-check.mjs --sha "$CANDIDATE_SHA" --required-check canonical-qa --timeout-ms 7200000 --poll-ms 30000
