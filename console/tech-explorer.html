function makeFlareTex(inner, mid, spikes = true) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.16, inner); g.addColorStop(0.45, mid); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  if (spikes) {
    ctx.save(); ctx.translate(128, 128);
    for (let i = 0; i < 2; i++) {
      ctx.rotate(Math.PI / 2);
      const sg = ctx.createLinearGradient(-115, 0, 115, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, '#ffffff'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg; ctx.fillRect(-115, -1.4, 230, 2.8);
    }
    ctx.restore();
  }
  return new THREE.CanvasTexture(c);
}

function addBeam(pts, hex, radius = 0.42, pulseTex = texCyan, speed = 0.45) {
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 44, radius, 8, false),
    new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  stageGroup.add(tube);
  const pulse = new THREE.Sprite(new THREE.SpriteMaterial({
    map: pulseTex, transparent: true, opacity: 0.96, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  pulse.scale.set(9, 9, 1);
  stageGroup.add(pulse);
  activePulses.push({ curve, pulse, speed, offset: Math.random() });
  return curve;
}

function addWireRing(r, y, hex, op = 0.45, tiltX = 0) {
  const pts = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: hex, transparent: true, opacity: op })
  );
  line.position.y = y;
  line.rotation.x = tiltX;
  stageGroup.add(line);
  return line;
}

    stageGroup.add(baseGrid);
    const loraGrid = new THREE.GridHelper(68, 10, 0x22e6ff, 0x10435c);
    loraGrid.position.y = 14;
    stageGroup.add(loraGrid);

    const anchors = [[-22, -14, -12], [0, -14, 14], [22, -14, -8]];
    anchors.forEach(([x, y, z], i) => {
      const oct = new THREE.Mesh(
        new THREE.OctahedronGeometry(4.2, 0),
        new THREE.MeshBasicMaterial({ color: 0xffbe3b, wireframe: true, transparent: true, opacity: 0.85 })
      );
      oct.position.set(x, y, z); stageGroup.add(oct);
      addNode(new THREE.Vector3(x, y, z), texGold, 15, i === 1 ? 'Old Skills Locked Safe' : '', 'gold');
      // Vertical Fisher-information tether connecting locked base to fast LoRA layer
      addBeam([new THREE.Vector3(x, y, z), new THREE.Vector3(x, 14, z)], 0xffbe3b, 0.35, texGold, 0.4);
    });
    const wavePts = [];
    for (let i = 0; i <= 20; i++) {
      const x = -34 + (i / 20) * 68;
      wavePts.push(new THREE.Vector3(x, 14 + Math.sin(i * 0.7) * 7, Math.cos(i * 0.7) * 14));
    }
    addBeam(wavePts, 0x22e6ff, 0.72, texCyan, 0.65);
    addNode(new THREE.Vector3(-24, 22, 6), texCyan, 16, 'New Skill Learned Instantly');
    addNode(new THREE.Vector3(24, 20, -6), texGreen, 16, 'Never Forgets What Worked ✓', 'emerald');
  } else if (type === 'wifi') {
    // 12 RuView: Translucent Glass Wall + WiFi CSI Radio Waves + Volumetric Holographic DensePose Figure
    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 44, 46),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.14 })
    );
    wall.position.set(-16, 0, 0);
    stageGroup.add(wall);
    const wallEdge = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 44, 46),
      new THREE.MeshBasicMaterial({ color: 0x22e6ff, wireframe: true, transparent: true, opacity: 0.35 })
    );
    wallEdge.position.copy(wall.position); stageGroup.add(wallEdge);
    addNode(new THREE.Vector3(-16, 24, 0), texCyan, 11, 'Solid Wall (WiFi Passes Through)');

    const tx = new THREE.Vector3(-40, 0, 0);
    const rx = new THREE.Vector3(38, 0, 0);
    addNode(tx, texCyan, 18, 'Normal WiFi Router');
    addNode(rx, texGreen, 18, 'WiFi Sensor', 'emerald');
    for (let i = 1; i <= 6; i++) {
      const r = addWireRing(i * 7.5, 0, 0x22e6ff, 0.58 - i * 0.07, Math.PI / 2);
      r.position.set(-40 + i * 11, 0, 0); r.rotation.y = Math.PI / 2;
    }
    // Volumetric Holographic Wireframe Torso/Head Silhouette (no stick figure!)
    const holoMat = new THREE.MeshBasicMaterial({ color: 0xffbe3b, wireframe: true, transparent: true, opacity: 0.78 });
    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(4.5, 12, 10), holoMat);
    headMesh.position.set(10, 16, 0); stageGroup.add(headMesh);
    const torsoMesh = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 5.0, 18, 12, 3), holoMat);
    torsoMesh.position.set(10, 2, 0); stageGroup.add(torsoMesh);
    const legsMesh = new THREE.Mesh(new THREE.CylinderGeometry(4.8, 3.6, 16, 10, 2), holoMat);
    legsMesh.position.set(10, -15, 0); stageGroup.add(legsMesh);
    addNode(new THREE.Vector3(10, 23, 0), texGold, 13, '0 Cameras · Person Detected', 'gold');
    addNode(new THREE.Vector3(10, 5, 6), texGreen, 14, 'Breathing & Heartbeat', 'emerald');
  } else if (type === 'shield') {
    // 13 AIMDS: Dual-Boundary Geodesic Shield with Deflected Attack Bounce + Clean Verified Exit
    const core = new THREE.Vector3(0, 0, 0);
    addNode(core, texCyan, 24, 'Your AI');
    const dome = new THREE.Mesh(
      new THREE.IcosahedronGeometry(22, 2),
      new THREE.MeshBasicMaterial({ color: 0x38f2a3, wireframe: true, transparent: true, opacity: 0.42 })
    );
    stageGroup.add(dome);
    const inb = new THREE.Vector3(-38, 12, 0);
    const impact = new THREE.Vector3(-22, 4, 0);
    const deflect = new THREE.Vector3(-34, -18, 8);
    const out = new THREE.Vector3(36, -6, 0);
    addNode(inb, texMag, 16, 'Hacker Trick Blocked ✕', 'magenta');
    addNode(impact, texMag, 12, '');
    addNode(out, texGreen, 16, 'Safe, Clean Answer ✓', 'emerald');
    addBeam([inb, impact, deflect], 0xff4fd8, 0.62, texMag, 0.65);
    addBeam([new THREE.Vector3(22, -3, 0), out], 0x38f2a3, 0.62, texGreen, 0.65);
  } else if (type === 'mesh') {
    // 14 QuDAG: Nested Post-Quantum Onion Encryption Shells + True 3D DAG Multi-Hop Path + Blocked Quantum Attacker
    const sender = new THREE.Vector3(-38, -8, 10);
    const hop1 = new THREE.Vector3(-12, 16, -8);
    const hop2 = new THREE.Vector3(14, -10, -12);
    const recv = new THREE.Vector3(38, 10, 8);
    addNode(sender, texCyan, 17, 'Sender (Locks Message)');
    addNode(hop1, texMag, 17, 'Secret Stop 1', 'magenta');
    addNode(hop2, texMag, 17, 'Secret Stop 2', 'magenta');
    addNode(recv, texGreen, 18, 'Receiver (Unlocks ✓)', 'emerald');
    // Nested Quantum-Resistant Lattice Shell around Hop 1
    const qShell = new THREE.Mesh(
      new THREE.OctahedronGeometry(11, 1),
      new THREE.MeshBasicMaterial({ color: 0xff4fd8, wireframe: true, transparent: true, opacity: 0.48 })
    );
    qShell.position.copy(hop1); stageGroup.add(qShell);
    addBeam([sender, hop1, hop2, recv], 0xff4fd8, 0.68, texMag, 0.48);
    // Secondary DAG parallel verification arcs
    addBeam([sender, new THREE.Vector3(-8, -18, 14), hop2], 0x22e6ff, 0.3, texCyan, 0.38);
    addBeam([hop1, new THREE.Vector3(16, 20, 6), recv], 0x22e6ff, 0.3, texCyan, 0.38);
    // Quantum Attacker blocked outside
    const attacker = new THREE.Vector3(-2, -28, 12);
    addNode(attacker, texGold, 13, 'Future Super-Computer (Locked Out)', 'gold');
  } else {
    // 15 ruv-FANN: 3-Layer Rust/WASM Neural Network framed inside a translucent 256MB Edge Sandbox Cube
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(76, 54, 28),
      new THREE.MeshBasicMaterial({ color: 0x38f2a3, wireframe: true, transparent: true, opacity: 0.24 })
    );
    stageGroup.add(box);
    addNode(new THREE.Vector3(0, 30, 0), texGreen, 11, 'Tiny $20 Device / Browser · No Cloud', 'emerald');
    const layers = [
      { x: -28, n: 4, lbl: 'Live Sensor Data', tex: texGold, cls: 'gold' },
      { x: 0, n: 5, lbl: 'Fast Mini-Brain', tex: texCyan, cls: '' },
      { x: 28, n: 3, lbl: 'Instant Answer (< 1 ms)', tex: texGreen, cls: 'emerald' },
    ];
    const coords = layers.map((l) => {
      const arr = [];
      for (let i = 0; i < l.n; i++) {
        const y = ((i - (l.n - 1) / 2) * 12);
        const p = new THREE.Vector3(l.x, y, 0);
        arr.push(p);
        addNode(p, l.tex, 14, i === 0 ? l.lbl : '', l.cls);
      }
      return arr;
    });
    for (let li = 0; li < coords.length - 1; li++) {
      coords[li].forEach((a, ai) => {
        coords[li + 1].forEach((b, bi) => {
          if ((ai + bi) % 2 === 0) addBeam([a, b], li === 0 ? 0x22e6ff : 0x38f2a3, 0.3, li === 0 ? texCyan : texGreen, 0.45 + (ai % 3) * 0.12);
        });
      });
    }
  }
}

// ── 3. UI BINDING + URL QUERY PARAM (?tech=<id>) ──
const leftRail = document.getElementById('left-rail');
const railIdxEl = document.getElementById('rail-idx');
const rpKicker = document.getElementById('rp-kicker');
const rpTitle = document.getElementById('rp-title');
const stProblem = document.getElementById('st-problem');
const stSolution = document.getElementById('st-solution');
const stEnables = document.getElementById('st-enables');
const stExample = document.getElementById('st-example');
const proofStore = document.getElementById('proof-store');
const copyBtn = document.getElementById('copy-prompt');
const autoBtn = document.getElementById('btn-auto');

let currentIdx = 0;
let autoCycle = false;
let cycleTimer = 0;

TECHS.forEach((t, i) => {
  const btn = document.createElement('button');
  btn.className = 'tech-item';
  btn.innerHTML = `<span class="ti-num">${t.num}</span><div><div class="ti-name">${t.short}</div><span class="ti-sub">${t.sub}</span></div>`;
  btn.addEventListener('click', () => selectTech(i, false));
  leftRail.appendChild(btn);
});

function selectTech(idx, keepAuto = false) {
  currentIdx = (idx + TECHS.length) % TECHS.length;
  cycleTimer = 0;
  const t = TECHS[currentIdx];
  railIdxEl.textContent = `${currentIdx + 1} / ${TECHS.length}`;
  leftRail.querySelectorAll('.tech-item').forEach((b, i) => {
    b.classList.toggle('active', i === currentIdx);
    if (i === currentIdx) b.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  rpKicker.textContent = t.kicker;
  rpTitle.textContent = t.title;
  stProblem.textContent = t.problem;
  stSolution.textContent = t.solution;
  stEnables.textContent = t.enables;
  stExample.textContent = t.example;
  proofStore.textContent = t.store;
  copyBtn.textContent = 'Copy search_ruvnet prompt';
  copyBtn.onclick = () => {
    navigator.clipboard?.writeText(t.prompt);
    copyBtn.textContent = 'Copied! Paste into Claude / Codex / AGY';
    setTimeout(() => { copyBtn.textContent = 'Copy search_ruvnet prompt'; }, 1800);
  };
  buildScene(t.sceneType);
  if (!keepAuto) { autoCycle = false; autoBtn.textContent = 'Auto-Cycle'; }
}

// Read ?tech=<id> from URL so /rvbc Console cards open the exact right 3D scene on demand!
const urlTech = new URLSearchParams(window.location.search).get('tech');
const startIdx = urlTech ? Math.max(0, TECHS.findIndex((t) => t.id === urlTech)) : 0;
selectTech(startIdx, false);

document.getElementById('btn-prev').addEventListener('click', () => selectTech(currentIdx - 1, false));
document.getElementById('btn-next').addEventListener('click', () => selectTech(currentIdx + 1, false));
autoBtn.addEventListener('click', () => {
  autoCycle = !autoCycle;
  autoBtn.textContent = autoCycle ? 'Pause Cycle' : 'Auto-Cycle';
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') selectTech(currentIdx + 1, false);
  if (e.key === 'ArrowLeft') selectTech(currentIdx - 1, false);
});

// ── 4. RENDER LOOP ──
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
let frames = 0, fpsAcc = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();

  stageGroup.rotation.y += dt * 0.14;
  for (const p of activePulses) {
    const u = (elapsed * p.speed + p.offset) % 1;
    p.curve.getPointAt(u, p.pulse.position);
  }
  if (autoCycle) {
    cycleTimer += dt;
    if (cycleTimer >= 7.5) selectTech(currentIdx + 1, true);
  }

  controls.update();
  renderer.render(scene, camera);

  // Project 3D component labels into crisp screen space (staying clear of left/right rails)
  const w = window.innerWidth, h = window.innerHeight;
  const minX = 262, maxX = w - 412;
  for (const l of activeLabels) {
    l.obj.getWorldPosition(tmpV);
    tmpV.project(camera);
    const x = (tmpV.x * 0.5 + 0.5) * w;
    const y = (-tmpV.y * 0.5 + 0.5) * h;
    const ok = tmpV.z < 1 && x > minX && x < maxX && y > 32 && y < h - 70;
    l.el.style.opacity = ok ? '1' : '0';
    if (ok) { l.el.style.left = x.toFixed(1) + 'px'; l.el.style.top = y.toFixed(1) + 'px'; }
  }

  frames++; fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    fpsEl.textContent = `${Math.round(frames / fpsAcc)} FPS`;
    frames = 0; fpsAcc = 0;
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
